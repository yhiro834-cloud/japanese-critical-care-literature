<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">侵襲的手技の安全ライフサイクル</title><desc id="desc">適応、同意、タイムアウト、実施中監視、中断と救済、手技後確認、機器管理と抜去を一つの循環として示す。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#31546D"/></marker></defs><rect width="1600" height="900" fill="#fff"/>
<text x="70" y="72" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="42" font-weight="700" fill="#172B3A">侵襲的手技：「入った」で終わらず、適応から抜去まで閉じる</text><text x="70" y="116" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="23" fill="#526B7A">全員が疑問を言えるタイムアウトと、事前に決めた中断・救済計画を持つ</text>
<g font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" text-anchor="middle"><rect x="60" y="235" width="240" height="180" rx="28" fill="#EAF2F7"/><text x="180" y="285" font-size="26" font-weight="700">1 適応</text><text x="180" y="330" font-size="19">目的・緊急度・代替</text><text x="180" y="365" font-size="19">成功・中止条件</text><rect x="320" y="235" width="240" height="180" rx="28" fill="#FFF2D9"/><text x="440" y="285" font-size="26" font-weight="700">2 同意・準備</text><text x="440" y="330" font-size="19">能力・通訳・リスク</text><text x="440" y="365" font-size="19">人員・器材・救済</text><rect x="580" y="235" width="240" height="180" rx="28" fill="#EEEAFE"/><text x="700" y="285" font-size="26" font-weight="700">3 タイムアウト</text><text x="700" y="330" font-size="19">患者・手技・部位</text><text x="700" y="365" font-size="19">役割・検体・中断合図</text><rect x="840" y="235" width="240" height="180" rx="28" fill="#FDE9E8"/><text x="960" y="285" font-size="26" font-weight="700">4 実施・監視</text><text x="960" y="330" font-size="19">意識・呼吸・循環</text><text x="960" y="365" font-size="19">清潔・試行回数・変化</text><rect x="1100" y="235" width="240" height="180" rx="28" fill="#FFF1EF"/><text x="1220" y="285" font-size="26" font-weight="700">5 中断・救済</text><text x="1220" y="330" font-size="19">悪化・抵抗・出血</text><text x="1220" y="365" font-size="19">気道・循環・応援</text><rect x="1360" y="235" width="180" height="180" rx="28" fill="#E7F6EE"/><text x="1450" y="285" font-size="26" font-weight="700">6 手技後</text><text x="1450" y="330" font-size="19">位置・機能</text><text x="1450" y="365" font-size="19">合併症</text></g>
<g stroke="#31546D" stroke-width="6" marker-end="url(#a)"><path d="M305 325 H310"/><path d="M565 325 H570"/><path d="M825 325 H830"/><path d="M1085 325 H1090"/><path d="M1345 325 H1350"/></g>
<rect x="180" y="520" width="1240" height="190" rx="30" fill="#F4F7F9"/><text x="800" y="570" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="28" font-weight="700" fill="#172B3A">手技後も続く管理</text><text x="230" y="620" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="22">固定・深さ・接続・ドレッシング・検体・画像・使用開始条件・担当者・次回確認</text><text x="230" y="665" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="22">毎日：適応、感染、皮膚、血栓、閉塞、患者負担を再評価し、不要なら速やかに抜去</text>
<path d="M1450 425 V755 H180 V425" stroke="#31546D" stroke-width="6" fill="none" marker-end="url(#a)"/><text x="800" y="790" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="21" fill="#526B7A">合併症や目的未達なら、同じ方法を反復せず適応・術者・画像・場所・手技を更新</text><text x="800" y="880" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="17" fill="#526B7A">FIG-PROC-001 · 手技安全SSOT・施設手順を参照 · 確認日 2026-08-12</text></svg>
