<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">気管切開の解剖と急変時安全確認</title><desc id="desc">上気道、気管切開孔、カニューレ、気管、肺の位置関係と、気管切開患者急変時の確認順序を示す。</desc><rect width="1600" height="900" fill="#f7fafc"/><text x="75" y="78" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="42" font-weight="700" fill="#18384f">気管切開：上気道との交通と瘻孔の成熟度で救助手順が変わる</text><text x="75" y="120" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="22" fill="#526d80">患者を酸素化しながら、カニューレだけでなく上気道・気管・肺・機器を同時に評価</text><g stroke="#326f91" stroke-width="14" fill="none" stroke-linecap="round"><path d="M380 210 C300 230 290 330 355 370 L430 415 V690"/><path d="M430 690 C380 735 330 760 285 780"/><path d="M430 690 C480 735 530 760 575 780"/></g><path d="M245 765 Q295 650 405 735 Q335 830 245 765Z" fill="#cde9f5" stroke="#326f91" stroke-width="4"/><path d="M455 735 Q565 650 615 765 Q525 830 455 735Z" fill="#cde9f5" stroke="#326f91" stroke-width="4"/><path d="M215 462 H410 Q455 462 455 510" fill="none" stroke="#d26055" stroke-width="24" stroke-linecap="round"/><rect x="190" y="430" width="90" height="65" rx="16" fill="#fff" stroke="#d26055" stroke-width="5"/><text x="125" y="407" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="22" font-weight="700" fill="#b34038">気管切開孔</text><text x="495" y="455" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="21" fill="#18384f">カニューレ先端</text><line x1="490" y1="465" x2="455" y2="500" stroke="#18384f" stroke-width="3"/><text x="140" y="225" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="21" fill="#18384f">口・鼻からの上気道</text><line x1="315" y1="235" x2="355" y2="275" stroke="#18384f" stroke-width="3"/><rect x="730" y="180" width="790" height="560" rx="28" fill="#fff" stroke="#326f91" stroke-width="4"/><text x="1125" y="235" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="30" font-weight="700" fill="#18384f">突然の低酸素・換気不良</text><g font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif"><g fill="#e9f5fb" stroke="#326f91" stroke-width="3"><rect x="790" y="285" width="300" height="115" rx="18"/><rect x="1160" y="285" width="300" height="115" rx="18"/><rect x="790" y="455" width="300" height="115" rx="18"/><rect x="1160" y="455" width="300" height="115" rx="18"/></g><g text-anchor="middle" fill="#18384f"><text x="940" y="327" font-size="23" font-weight="700">1 患者と酸素化</text><text x="940" y="365" font-size="19">胸郭・呼吸・脈・応援</text><text x="1310" y="327" font-size="23" font-weight="700">2 開通性と位置</text><text x="1310" y="365" font-size="19">分泌物・屈曲・逸脱</text><text x="940" y="497" font-size="23" font-weight="700">3 上気道の利用可否</text><text x="940" y="535" font-size="19">術式・閉塞・喉頭の状態</text><text x="1310" y="497" font-size="23" font-weight="700">4 肺・回路・機器</text><text x="1310" y="535" font-size="19">気胸・接続・酸素源</text></g><rect x="820" y="625" width="610" height="70" rx="16" fill="#fff0ef"/><text x="1125" y="654" text-anchor="middle" font-size="20" font-weight="700" fill="#b34038">新しい瘻孔へ盲目的に再挿入しない</text><text x="1125" y="682" text-anchor="middle" font-size="18" fill="#526d80">作成日・術式・成熟度・予備カニューレ・施設手順を確認</text></g><text x="75" y="850" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="17" fill="#60778a">教育用模式図：上気道との交通や再挿入の安全性は患者・術式・経過日数で異なる。緊急時は専門チームと施設アルゴリズムを優先する。</text></svg>
