<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">肺エコーartifactの模式図</title><desc id="desc">胸膜線、A-line、B-line、胸水と無気肺またはconsolidationの模式図を比較し、実像ではないことと単独診断を避ける注意を示す。</desc><rect width="1600" height="900" fill="#fff"/><text x="80" y="75" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="42" font-weight="700" fill="#172B3A">肺POCUS：artifactは病名ではなく、臨床仮説の手掛かり</text><text x="80" y="118" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="23" fill="#526B7A">教育用模式図。実際の超音波画像、probe操作、credentialing、画像保存・QAを置き換えない</text><g font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" text-anchor="middle"><rect x="60" y="190" width="350" height="480" rx="28" fill="#F6F7F8"/><text x="235" y="245" font-size="27" font-weight="700">Pleural sliding / A-line</text><line x1="100" y1="315" x2="370" y2="315" stroke="#2B7A9B" stroke-width="10"/><line x1="130" y1="410" x2="340" y2="410" stroke="#8295A3" stroke-width="5"/><line x1="155" y1="505" x2="315" y2="505" stroke="#AAB7C0" stroke-width="4"/><text x="235" y="590" font-size="20">反復する水平artifact</text><text x="235" y="625" font-size="18">slidingの有無を動画で評価</text><rect x="440" y="190" width="350" height="480" rx="28" fill="#F2FAFD"/><text x="615" y="245" font-size="27" font-weight="700">B-line</text><line x1="480" y1="315" x2="750" y2="315" stroke="#2B7A9B" stroke-width="10"/><g stroke="#77C8E5" stroke-width="12"><line x1="535" y1="315" x2="535" y2="575"/><line x1="615" y1="315" x2="615" y2="575"/><line x1="695" y1="315" x2="695" y2="575"/></g><text x="615" y="625" font-size="18">胸膜から深部へ続く縦artifact</text><rect x="820" y="190" width="350" height="480" rx="28" fill="#EAF2F7"/><text x="995" y="245" font-size="27" font-weight="700">Pleural effusion</text><line x1="860" y1="315" x2="1130" y2="315" stroke="#2B7A9B" stroke-width="10"/><path d="M870 380 Q995 330 1120 380 V550 H870Z" fill="#77C8E5"/><ellipse cx="995" cy="430" rx="75" ry="35" fill="#D9CFF7"/><text x="995" y="625" font-size="18">液体spaceと圧排された肺の模式</text><rect x="1200" y="190" width="340" height="480" rx="28" fill="#FFF3F1"/><text x="1370" y="245" font-size="27" font-weight="700">Consolidation</text><line x1="1240" y1="315" x2="1500" y2="315" stroke="#2B7A9B" stroke-width="10"/><path d="M1260 345 Q1370 300 1480 350 V570 H1260Z" fill="#D9CFF7"/><path d="M1310 520 Q1370 380 1430 520" fill="none" stroke="#fff" stroke-width="12"/><text x="1370" y="625" font-size="18">組織様patternの概念</text></g><rect x="140" y="730" width="1320" height="95" rx="26" fill="#FFF2D9"/><text x="800" y="770" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="24" font-weight="700" fill="#8B5B00">B-line＝心不全、slidingあり＝全気胸除外、IVC＝volume、とは決めない</text><text x="800" y="805" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="20" fill="#526B7A">focused question・複数view・画像quality・患者所見・上位検査・介入後再評価を統合</text><text x="800" y="880" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="17" fill="#526B7A">FIG-P-POCUS-001 · 模式図であり実像ではない · SCCM CCUS 2024 / POCUS SSOT参照 · 確認日 2026-08-12</text></svg>
