<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">持続的腎代替療法（CRRT）の警報の臨床推論</title><desc id="desc">持続的腎代替療法（CRRT）の警報時に患者、脱血側、filter回路、返血側、装置を順に確認し、原因と影響を再評価する流れ。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#31546D"/></marker></defs><rect width="1600" height="900" fill="#fff"/><text x="80" y="78" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="42" font-weight="700" fill="#172B3A">持続的腎代替療法（CRRT）の警報：リセットする前に、患者と圧の変化を読む</text><text x="80" y="120" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="24" fill="#526B7A">出血・空気混入・接続外れ・重度低血圧は緊急。機種取扱説明書とtrained teamへ接続する</text><g font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" text-anchor="middle"><rect x="60" y="240" width="270" height="310" rx="28" fill="#FDE9E8"/><text x="195" y="300" font-size="28" font-weight="700">1 患者</text><text x="195" y="360" font-size="21">意識・血圧・灌流</text><text x="195" y="405" font-size="21">出血・空気混入・接続</text><text x="195" y="450" font-size="21">急変なら生命維持を優先</text><rect x="365" y="240" width="270" height="310" rx="28" fill="#FFF2D9"/><text x="500" y="300" font-size="28" font-weight="700">2 脱血側</text><text x="500" y="360" font-size="21">体位・屈曲・カテーテル</text><text x="500" y="405" font-size="21">脱血圧推移</text><text x="500" y="450" font-size="21">循環血液量・胸腹圧</text><rect x="670" y="240" width="270" height="310" rx="28" fill="#EEEAFE"/><text x="805" y="300" font-size="28" font-weight="700">3 フィルタ・回路</text><text x="805" y="360" font-size="21">膜間圧・フィルタ圧推移</text><text x="805" y="405" font-size="21">血栓・血液濃縮</text><text x="805" y="450" font-size="21">バッグ・回路・液種</text><rect x="975" y="240" width="270" height="310" rx="28" fill="#E7F6EE"/><text x="1110" y="300" font-size="28" font-weight="700">4 返血側</text><text x="1110" y="360" font-size="21">返血圧・屈曲</text><text x="1110" y="405" font-size="21">クランプ・接続・空気混入</text><text x="1110" y="450" font-size="21">穿刺部・固定</text><rect x="1280" y="240" width="270" height="310" rx="28" fill="#EAF2F7"/><text x="1415" y="300" font-size="28" font-weight="700">5 装置</text><text x="1415" y="360" font-size="21">センサー・重量計</text><text x="1415" y="405" font-size="21">電源・設定・取扱説明書</text><text x="1415" y="450" font-size="21">担当者へ報告</text></g><g stroke="#31546D" stroke-width="7" marker-end="url(#a)"><path d="M335 395 H350"/><path d="M640 395 H655"/><path d="M945 395 H960"/><path d="M1250 395 H1265"/></g><rect x="150" y="660" width="1300" height="135" rx="28" fill="#FFF4F2"/><text x="800" y="707" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="27" font-weight="700" fill="#B21F2D">禁止：原因不明のリセット反復、安全機構の迂回、無断の回路反転・フラッシュ</text><text x="800" y="750" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="22" fill="#526B7A">停止時間・血液損失・水分・薬剤・電解質への影響を記録し、再開後も再評価</text><text x="800" y="880" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="17" fill="#526B7A">FIG-R-CRRT-003 · 圧の符号・名称は機種で異なる · 機種取扱説明書・施設手順を優先 · 確認日 2026-08-12</text></svg>
