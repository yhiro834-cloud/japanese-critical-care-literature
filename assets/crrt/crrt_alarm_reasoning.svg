<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">CRRT alarmの臨床推論</title><desc id="desc">CRRT alarm時に患者、access、filter回路、return、machineを順に確認し、原因と影響を再評価する流れ。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#31546D"/></marker></defs><rect width="1600" height="900" fill="#fff"/><text x="80" y="78" font-family="Arial" font-size="42" font-weight="700" fill="#172B3A">CRRT alarm：resetする前に、患者と圧patternを読む</text><text x="80" y="120" font-family="Arial" font-size="24" fill="#526B7A">出血・air・disconnection・重度低血圧は緊急。機種manualとtrained teamへ接続する</text><g font-family="Arial" text-anchor="middle"><rect x="60" y="240" width="270" height="310" rx="28" fill="#FDE9E8"/><text x="195" y="300" font-size="28" font-weight="700">1 患者</text><text x="195" y="360" font-size="21">意識・血圧・灌流</text><text x="195" y="405" font-size="21">出血・air・接続</text><text x="195" y="450" font-size="21">急変ならsupport優先</text><rect x="365" y="240" width="270" height="310" rx="28" fill="#FFF2D9"/><text x="500" y="300" font-size="28" font-weight="700">2 Access</text><text x="500" y="360" font-size="21">体位・屈曲・catheter</text><text x="500" y="405" font-size="21">脱血圧trend</text><text x="500" y="450" font-size="21">volume/胸腹圧</text><rect x="670" y="240" width="270" height="310" rx="28" fill="#EEEAFE"/><text x="805" y="300" font-size="28" font-weight="700">3 Filter / 回路</text><text x="805" y="360" font-size="21">TMP・filter圧trend</text><text x="805" y="405" font-size="21">clot・hemoconcentration</text><text x="805" y="450" font-size="21">bag・line・液種</text><rect x="975" y="240" width="270" height="310" rx="28" fill="#E7F6EE"/><text x="1110" y="300" font-size="28" font-weight="700">4 Return</text><text x="1110" y="360" font-size="21">返血圧・屈曲</text><text x="1110" y="405" font-size="21">clamp・接続・air</text><text x="1110" y="450" font-size="21">穿刺部・固定</text><rect x="1280" y="240" width="270" height="310" rx="28" fill="#EAF2F7"/><text x="1415" y="300" font-size="28" font-weight="700">5 Machine</text><text x="1415" y="360" font-size="21">sensor・scale</text><text x="1415" y="405" font-size="21">電源・設定・manual</text><text x="1415" y="450" font-size="21">担当者へ報告</text></g><g stroke="#31546D" stroke-width="7" marker-end="url(#a)"><path d="M335 395 H350"/><path d="M640 395 H655"/><path d="M945 395 H960"/><path d="M1250 395 H1265"/></g><rect x="150" y="660" width="1300" height="135" rx="28" fill="#FFF4F2"/><text x="800" y="707" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#B21F2D">禁止：原因不明のreset反復、安全機構の迂回、無断line reversal・flush</text><text x="800" y="750" text-anchor="middle" font-family="Arial" font-size="22" fill="#526B7A">停止時間・血液損失・fluid/drug/electrolyteへの影響を記録し、再開後も再評価</text><text x="800" y="880" text-anchor="middle" font-family="Arial" font-size="17" fill="#526B7A">FIG-R-CRRT-003 · 圧の符号・名称は機種で異なる · 機種manual・施設protocolを優先 · 確認日 2026-08-12</text></svg>
