<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">CRRTの溶質・水分除去機序</title><desc id="desc">拡散、対流、限外濾過を三つの比較欄で示し、処方と実投与の差を説明する。</desc><rect width="1600" height="900" fill="#fff"/><text x="80" y="78" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="42" font-weight="700" fill="#172B3A">CRRT：diffusion・convection・限外濾過を区別する</text><text x="80" y="120" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="24" fill="#526B7A">どのmodeでもfilter、flow、停止時間、残存腎機能で実際のdeliveryは変わる</text><g font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" text-anchor="middle"><rect x="70" y="190" width="460" height="500" rx="30" fill="#F2FAFD"/><text x="300" y="255" font-size="31" font-weight="700" fill="#2B7A9B">Diffusion（拡散）</text><text x="300" y="300" font-size="22">濃い側 → 薄い側へ溶質が移動</text><line x1="300" y1="345" x2="300" y2="535" stroke="#31546D" stroke-width="8"/><g fill="#5B5BD6"><circle cx="200" cy="390" r="18"/><circle cx="235" cy="440" r="18"/><circle cx="190" cy="490" r="18"/></g><g fill="#5B5BD6"><circle cx="375" cy="430" r="18"/><circle cx="410" cy="480" r="18"/></g><text x="300" y="610" font-size="22">dialysate flowと濃度差</text><rect x="570" y="190" width="460" height="500" rx="30" fill="#F6F3FF"/><text x="800" y="255" font-size="31" font-weight="700" fill="#5B5BD6">Convection（対流）</text><text x="800" y="300" font-size="22">水の移動に溶質が一緒に運ばれる</text><line x1="800" y1="345" x2="800" y2="535" stroke="#31546D" stroke-width="8"/><path d="M680 420 H900" stroke="#2B7A9B" stroke-width="28"/><path d="M860 380 L940 420 L860 460Z" fill="#2B7A9B"/><g fill="#5B5BD6"><circle cx="730" cy="420" r="17"/><circle cx="825" cy="420" r="17"/></g><text x="800" y="610" font-size="22">replacement・filtration fraction</text><rect x="1070" y="190" width="460" height="500" rx="30" fill="#FFF2D9"/><text x="1300" y="255" font-size="31" font-weight="700" fill="#8B5B00">Ultrafiltration（限外濾過）</text><text x="1300" y="300" font-size="22">膜を越えて水分を除く</text><line x1="1190" y1="380" x2="1410" y2="380" stroke="#31546D" stroke-width="8"/><g fill="#2B7A9B"><path d="M1230 420 q30 55 60 0 q-30 -45 -60 0"/><path d="M1340 450 q30 55 60 0 q-30 -45 -60 0"/></g><text x="1300" y="610" font-size="22">machine除水 ≠ 患者全体の収支</text></g><rect x="150" y="745" width="1300" height="80" rx="24" fill="#EAF2F7"/><text x="800" y="795" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="25" font-weight="700" fill="#172B3A">処方量と実投与量：downtime・access・clot・pre/post dilutionを含めて確認</text><text x="800" y="880" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="17" fill="#526B7A">FIG-R-CRRT-002 · 定性的模式図 · dose/液組成は患者・機種・施設protocolで設定 · 確認日 2026-08-12</text></svg>
