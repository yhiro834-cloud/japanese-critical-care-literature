<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">CRRT回路の基本</title><desc id="desc">患者からaccess、血液pump、filter、returnを通る血液経路と、透析液、補充液、排液の接続を示す模式図。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#31546D"/></marker></defs><rect width="1600" height="900" fill="#fff"/><text x="80" y="78" font-family="Arial" font-size="42" font-weight="700" fill="#172B3A">CRRT回路：血液の道と、液体の道を分けて追う</text><text x="80" y="120" font-family="Arial" font-size="24" fill="#526B7A">患者 → 脱血（access）→ pump → filter → 返血（return）→ 患者</text><g font-family="Arial" text-anchor="middle"><circle cx="180" cy="420" r="105" fill="#E7F6EE" stroke="#26734D" stroke-width="7"/><text x="180" y="410" font-size="30" font-weight="700">患者</text><text x="180" y="450" font-size="20">血圧・灌流・出血</text><rect x="390" y="330" width="210" height="180" rx="28" fill="#EEEAFE"/><text x="495" y="400" font-size="28" font-weight="700">血液pump</text><text x="495" y="445" font-size="21">blood flow</text><rect x="750" y="275" width="260" height="290" rx="35" fill="#EAF2F7" stroke="#2B7A9B" stroke-width="7"/><text x="880" y="370" font-size="32" font-weight="700">Filter</text><text x="880" y="415" font-size="21">血液 ↔ 膜 ↔ 排液</text><text x="880" y="460" font-size="21">圧trend・clot</text><rect x="1170" y="330" width="210" height="180" rx="28" fill="#FDE9E8"/><text x="1275" y="400" font-size="28" font-weight="700">返血</text><text x="1275" y="445" font-size="21">air・接続・圧</text></g><g stroke="#31546D" stroke-width="12" fill="none" marker-end="url(#a)"><path d="M285 390 H370"/><path d="M610 390 H730"/><path d="M1020 390 H1150"/><path d="M1390 390 H1480 V650 H180 V540"/></g><g font-family="Arial" text-anchor="middle"><rect x="535" y="650" width="240" height="90" rx="20" fill="#DFF4FA"/><text x="655" y="687" font-size="23" font-weight="700">透析液 / 補充液</text><text x="655" y="720" font-size="19">液種・濃度・接続</text><path d="M655 640 V540 H750" stroke="#2B7A9B" stroke-width="7" fill="none" marker-end="url(#a)"/><rect x="930" y="650" width="240" height="90" rx="20" fill="#FFF2D9"/><text x="1050" y="687" font-size="23" font-weight="700">排液（effluent）</text><text x="1050" y="720" font-size="19">除去量・色・bag</text><path d="M1010 540 H1050 V640" stroke="#8B5B00" stroke-width="7" fill="none" marker-end="url(#a)"/></g><text x="800" y="815" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#B21F2D">Alarm時は患者 → access → filter/回路 → return → machine。安全機構を迂回しない</text><text x="800" y="880" text-anchor="middle" font-family="Arial" font-size="17" fill="#526B7A">FIG-R-CRRT-001 · 機種別配管図ではない · CRRT SSOTと施設manualを参照 · 確認日 2026-08-12</text></svg>
