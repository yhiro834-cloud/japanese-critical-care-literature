<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">共同意思決定の流れ</title><desc id="desc">意思決定能力、患者の価値観、選択肢、治療試行、症状ケア、再評価をつなぐ図。</desc><rect width="1600" height="900" fill="#fbfaf7"/><text x="80" y="78" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="42" font-weight="700" fill="#25384a">共同意思決定：医学的に可能な治療を、患者の価値観へ結ぶ</text><text x="80" y="120" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="22" fill="#607385">一度決めて終わりではなく、症状を和らげながら再評価する</text><g font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif"><g fill="#e9f2fb" stroke="#3974a8" stroke-width="3"><rect x="80" y="200" width="260" height="150" rx="24"/><rect x="380" y="200" width="260" height="150" rx="24"/><rect x="680" y="200" width="260" height="150" rx="24"/><rect x="980" y="200" width="260" height="150" rx="24"/><rect x="1280" y="200" width="240" height="150" rx="24"/></g><g fill="#25384a" text-anchor="middle"><text x="210" y="250" font-size="24" font-weight="700">1 意思決定能力</text><text x="210" y="288" font-size="19">理解・比較・表明</text><text x="210" y="320" font-size="18">せん妄や言語を補う</text><text x="510" y="250" font-size="24" font-weight="700">2 患者の声</text><text x="510" y="288" font-size="19">価値観・事前の意思</text><text x="510" y="320" font-size="18">必要時は適切な代理人</text><text x="810" y="250" font-size="24" font-weight="700">3 事実と不確実性</text><text x="810" y="288" font-size="19">最善・最悪・可能性</text><text x="810" y="320" font-size="18">わかる言葉で共有</text><text x="1110" y="250" font-size="24" font-weight="700">4 選択肢と推奨</text><text x="1110" y="288" font-size="19">利益・負担・代替</text><text x="1110" y="320" font-size="18">価値観へ結びつける</text><text x="1400" y="250" font-size="24" font-weight="700">5 決定・記録</text><text x="1400" y="288" font-size="19">治療範囲・症状計画</text><text x="1400" y="320" font-size="18">次回評価を明記</text></g><g stroke="#3974a8" stroke-width="5" fill="none"><path d="M340 275H380"/><path d="M640 275H680"/><path d="M940 275H980"/><path d="M1240 275H1280"/></g>
<rect x="170" y="440" width="560" height="255" rx="28" fill="#eff8ef" stroke="#448b58" stroke-width="4"/><text x="450" y="492" text-anchor="middle" font-size="28" font-weight="700" fill="#25384a">期限を決めた治療試行</text><text x="220" y="545" font-size="21" fill="#25384a">• 何を、何のために試すか</text><text x="220" y="588" font-size="21" fill="#25384a">• 評価日時・指標・担当者</text><text x="220" y="631" font-size="21" fill="#25384a">• 改善／不変／悪化時の選択肢</text><rect x="870" y="440" width="560" height="255" rx="28" fill="#fff0f2" stroke="#b85b6d" stroke-width="4"/><text x="1150" y="492" text-anchor="middle" font-size="28" font-weight="700" fill="#25384a">治療制限 ≠ ケアの制限</text><text x="920" y="545" font-size="21" fill="#25384a">• 疼痛・呼吸困難・不穏を緩和</text><text x="920" y="588" font-size="21" fill="#25384a">• 家族・文化・精神面を支援</text><text x="920" y="631" font-size="21" fill="#25384a">• DNARを他治療へ自動拡張しない</text><path d="M1150 695 C1150 790 450 790 450 695" fill="none" stroke="#6b7890" stroke-width="5" stroke-dasharray="12 10"/><text x="800" y="800" text-anchor="middle" font-size="22" font-weight="700" fill="#25384a">患者の状態・負担・価値観を再確認し、必要なら方針を更新</text></g><text x="80" y="865" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="17" fill="#607385">教育用概念図：法令・施設方針・倫理支援を用い、緊急でない不可逆的判断は十分な対話と記録のもとで行う。</text></svg>
