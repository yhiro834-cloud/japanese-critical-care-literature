<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">痛み・鎮静・せん妄・睡眠・離床の日次サイクル</title><desc id="desc">痛みの評価と治療、鎮静目標、せん妄評価、睡眠環境、家族参加、早期離床を毎日つなぎ、薬剤だけで問題を覆わず原因と反応を再評価する。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#31546D"/></marker></defs><rect width="1600" height="900" fill="#fff"/>
  <text x="70" y="72" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="42" font-weight="700" fill="#172B3A">痛み・鎮静・せん妄：薬剤だけでなく、毎日の目標と環境をつなぐ</text><text x="70" y="116" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="23" fill="#526B7A">評価 → 原因への介入 → 反応と害の再評価を、日中と夜間のサイクルで繰り返す</text>
  <g font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" text-anchor="middle"><circle cx="800" cy="460" r="130" fill="#F6F8FA" stroke="#31546D" stroke-width="7"/><text x="800" y="430" font-size="30" font-weight="700">患者の目標</text><text x="800" y="475" font-size="22">安全・快適・意思疎通</text><text x="800" y="510" font-size="22">臓器保護・回復</text>
  <rect x="150" y="200" width="300" height="150" rx="28" fill="#FDE9E8"/><text x="300" y="250" font-size="27" font-weight="700">痛み</text><text x="300" y="295" font-size="20">自己申告／行動尺度・原因治療</text><rect x="650" y="170" width="300" height="150" rx="28" fill="#EEEAFE"/><text x="800" y="220" font-size="27" font-weight="700">鎮静・覚醒</text><text x="800" y="265" font-size="20">目標深度・毎日の必要性</text><rect x="1150" y="200" width="300" height="150" rx="28" fill="#FFF2D9"/><text x="1300" y="250" font-size="27" font-weight="700">せん妄</text><text x="1300" y="295" font-size="20">注意・思考・変動・原因検索</text><rect x="150" y="610" width="300" height="150" rx="28" fill="#EAF2F7"/><text x="300" y="660" font-size="27" font-weight="700">睡眠・環境</text><text x="300" y="705" font-size="20">昼夜、光、音、処置の集約</text><rect x="650" y="640" width="300" height="150" rx="28" fill="#E7F6EE"/><text x="800" y="690" font-size="27" font-weight="700">離床・機能</text><text x="800" y="735" font-size="20">安全条件・段階・反応</text><rect x="1150" y="610" width="300" height="150" rx="28" fill="#F4F7F9"/><text x="1300" y="660" font-size="27" font-weight="700">家族・意思疎通</text><text x="1300" y="705" font-size="20">眼鏡・補聴・見当識・希望</text></g>
  <g stroke="#31546D" stroke-width="6" fill="none" marker-end="url(#a)"><path d="M455 310 Q610 350 680 405"/><path d="M800 325 V315"/><path d="M1145 310 Q990 350 920 405"/><path d="M455 660 Q610 600 680 520"/><path d="M800 635 V595"/><path d="M1145 660 Q990 600 920 520"/></g>
  <rect x="200" y="805" width="1200" height="45" rx="18" fill="#FFF1EF"/><text x="800" y="835" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="21" font-weight="700" fill="#B21F2D">鎮静を深くする前に、痛み・低酸素・尿閉・便秘・離脱・環境・神経学的原因を再確認</text><text x="800" y="880" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="17" fill="#526B7A">FIG-PADIS-001 · PADIS・早期離床SSOTを参照 · 評価尺度は施設手順で統一 · 確認日 2026-08-12</text></svg>
