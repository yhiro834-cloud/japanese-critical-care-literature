<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">SpO2突然低下の臨床推論</title><desc id="desc">SpO2低下時に患者、信号、気道、呼吸、循環、装置を並行評価し、支持と再評価へ進む流れ。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#31546D"/></marker></defs><rect width="1600" height="900" fill="#fff"/><text x="80" y="75" font-family="Arial" font-size="42" font-weight="700" fill="#172B3A">SpO₂突然低下：probeを見る前に、患者の酸素化と換気を支える</text><text x="80" y="118" font-family="Arial" font-size="23" fill="#526B7A">応援要請・ABCDE・必要なindependent supportを先行し、原因検索を並行する</text><g font-family="Arial" text-anchor="middle"><rect x="80" y="205" width="310" height="170" rx="28" fill="#FDE9E8"/><text x="235" y="260" font-size="28" font-weight="700">1 患者を直接評価</text><text x="235" y="310" font-size="21">意識・pulse・胸郭・呼吸努力</text><text x="235" y="345" font-size="20">cyanosis / 急変速度</text><rect x="465" y="205" width="310" height="170" rx="28" fill="#EAF2F7"/><text x="620" y="260" font-size="28" font-weight="700">2 Signalを検証</text><text x="620" y="310" font-size="21">plethとpulse・probe・灌流</text><text x="620" y="345" font-size="20">測定不良でもsupportを止めない</text><rect x="850" y="205" width="310" height="170" rx="28" fill="#FFF2D9"/><text x="1005" y="260" font-size="28" font-weight="700">3 A/Bを分ける</text><text x="1005" y="310" font-size="21">気道・tube・分泌物</text><text x="1005" y="345" font-size="20">肺・換気・胸腔内圧</text><rect x="1235" y="205" width="285" height="170" rx="28" fill="#EEEAFE"/><text x="1378" y="260" font-size="28" font-weight="700">4 Device/循環</text><text x="1378" y="310" font-size="20">接続・O₂源・設定・回路</text><text x="1378" y="345" font-size="20">low flow / PE / artifact</text></g><g stroke="#31546D" stroke-width="7" marker-end="url(#a)"><path d="M395 290 H450"/><path d="M780 290 H835"/><path d="M1165 290 H1220"/></g><rect x="100" y="470" width="430" height="190" rx="26" fill="#FFF4F2"/><text x="315" y="520" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#B21F2D">今すぐ除外する危険</text><text x="140" y="570" font-family="Arial" font-size="21">tube閉塞/脱落、緊張性気胸、</text><text x="140" y="610" font-family="Arial" font-size="21">回路disconnect、O₂供給停止、重度低灌流</text><rect x="590" y="470" width="910" height="190" rx="26" fill="#E7F6EE"/><text x="1045" y="520" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#26734D">支持 → 原因修正 → 同じ条件で再評価</text><text x="650" y="570" font-family="Arial" font-size="21">SpO₂/pleth、胸郭、呼吸音、ETCO₂、gas、血圧・灌流</text><text x="650" y="610" font-family="Arial" font-size="21">manual ventilationの反応だけでpatient/device原因を確定しない</text><rect x="160" y="735" width="1280" height="80" rx="24" fill="#EAF2F7"/><text x="800" y="785" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#172B3A">報告：いつから・患者所見・device/FiO₂・実施したsupport・反応・未除外の危険</text><text x="800" y="880" text-anchor="middle" font-family="Arial" font-size="17" fill="#526B7A">FIG-CR-001 · 急変時は院内緊急対応と施設protocolを優先 · 確認日 2026-08-12</text></svg>
