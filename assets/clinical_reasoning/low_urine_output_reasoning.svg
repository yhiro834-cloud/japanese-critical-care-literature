<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">尿量低下の臨床推論</title><desc id="desc">尿量低下時に測定と尿路を確認し、腎灌流、静脈うっ血、腎実質障害、閉塞、薬剤を評価して輸液の必要性と耐容性を分ける。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#31546D"/></marker></defs><rect width="1600" height="900" fill="#fff"/><text x="80" y="75" font-family="Arial" font-size="42" font-weight="700" fill="#172B3A">尿量低下：oliguriaはsignalであり、輸液の処方ではない</text><text x="80" y="118" font-family="Arial" font-size="23" fill="#526B7A">測定/閉塞、perfusion、congestion、腎実質、薬剤と全身trajectoryを分ける</text><g font-family="Arial" text-anchor="middle"><rect x="70" y="200" width="330" height="180" rx="28" fill="#FFF2D9"/><text x="235" y="255" font-size="27" font-weight="700">1 測定・尿路</text><text x="235" y="305" font-size="20">時刻・体重・catheter</text><text x="235" y="342" font-size="20">屈曲・閉塞・膀胱</text><rect x="460" y="200" width="330" height="180" rx="28" fill="#FDE9E8"/><text x="625" y="255" font-size="27" font-weight="700">2 Perfusion</text><text x="625" y="305" font-size="20">MAP・CO・CRT・lactate</text><text x="625" y="342" font-size="20">出血・sepsis・心機能</text><rect x="850" y="200" width="330" height="180" rx="28" fill="#EEEAFE"/><text x="1015" y="255" font-size="27" font-weight="700">3 Congestion</text><text x="1015" y="305" font-size="20">JVP・浮腫・呼吸・RV</text><text x="1015" y="342" font-size="20">腹腔/静脈圧</text><rect x="1240" y="200" width="290" height="180" rx="28" fill="#EAF2F7"/><text x="1385" y="255" font-size="27" font-weight="700">4 腎/薬剤</text><text x="1385" y="305" font-size="20">SCr・尿所見・toxin</text><text x="1385" y="342" font-size="20">電解質・acid–base</text></g><g stroke="#31546D" stroke-width="7" marker-end="url(#a)"><path d="M405 290 H445"/><path d="M795 290 H835"/><path d="M1185 290 H1225"/></g><rect x="110" y="480" width="540" height="190" rx="26" fill="#FFF4F2"/><text x="380" y="530" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#B21F2D">緊急性を決める</text><text x="150" y="580" font-family="Arial" font-size="21">K、pH、肺水腫、uremic complication、</text><text x="150" y="620" font-family="Arial" font-size="21">無尿、急速な全身悪化、閉塞/血管障害</text><rect x="710" y="480" width="780" height="190" rx="26" fill="#E7F6EE"/><text x="1100" y="530" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#26734D">介入は仮説と目的を明示</text><text x="770" y="580" font-family="Arial" font-size="21">fluidなら responsiveness ＋ need ＋ tolerance</text><text x="770" y="620" font-family="Arial" font-size="21">尿量だけでなく灌流・呼吸・うっ血・K/pHを再評価</text><rect x="160" y="745" width="1280" height="75" rx="24" fill="#EAF2F7"/><text x="800" y="792" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#172B3A">報告：何時間・実測量・catheter・累積収支・灌流/うっ血・検査・介入反応</text><text x="800" y="880" text-anchor="middle" font-family="Arial" font-size="17" fill="#526B7A">FIG-CR-004 · AKI/KRT SSOTを参照 · 緊急KRT適応を遅らせない · 確認日 2026-08-12</text></svg>
