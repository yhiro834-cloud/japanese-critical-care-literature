<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">ICPとCPPの関係</title><desc id="desc">CPPはMAPからICPを引いた概念であり、ICP上昇またはMAP低下で脳灌流圧が低下すること、単一数値で判断しないことを示す。</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12Z" fill="#31546D"/></marker></defs><rect width="1600" height="900" fill="#fff"/><text x="80" y="78" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="42" font-weight="700" fill="#172B3A">脳灌流圧（CPP）＝平均動脈圧（MAP）−頭蓋内圧（ICP）</text><text x="80" y="120" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="24" fill="#526B7A">基本式はmental model。静脈圧・autoregulation・全身病態により単純化できない場面がある</text><g font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" text-anchor="middle"><rect x="120" y="240" width="380" height="300" rx="35" fill="#E7F6EE"/><text x="310" y="310" font-size="36" font-weight="700" fill="#26734D">MAP</text><text x="310" y="365" font-size="24">脳へ血液を押す側</text><text x="310" y="430" font-size="22">低血圧で低下</text><text x="310" y="475" font-size="22">測定品質も確認</text><text x="595" y="400" font-size="70" font-weight="700">−</text><rect x="680" y="240" width="380" height="300" rx="35" fill="#FDE9E8"/><text x="870" y="310" font-size="36" font-weight="700" fill="#B21F2D">ICP</text><text x="870" y="365" font-size="24">頭蓋内から押し返す側</text><text x="870" y="430" font-size="22">浮腫・血腫・CSFなどで上昇</text><text x="870" y="475" font-size="22">level・波形・体位も確認</text><text x="1155" y="400" font-size="70" font-weight="700">＝</text><rect x="1240" y="240" width="260" height="300" rx="35" fill="#EEEAFE"/><text x="1370" y="310" font-size="36" font-weight="700" fill="#5B5BD6">CPP</text><text x="1370" y="365" font-size="24">脳灌流圧</text><text x="1370" y="430" font-size="22">MAP↓ または ICP↑</text><text x="1370" y="475" font-size="22" fill="#B21F2D">→ CPP低下</text></g><path d="M1370 555 V650" stroke="#31546D" stroke-width="8" marker-end="url(#a)"/><rect x="250" y="680" width="1100" height="125" rx="28" fill="#EAF2F7"/><text x="800" y="725" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="27" font-weight="700" fill="#172B3A">同時に守る：酸素化・血圧・CO₂・体温・静脈還流・痙攣・原因治療</text><text x="800" y="768" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="22" fill="#B21F2D">単一CPP targetを全患者へ当てはめず、神経所見と全身への害を再評価</text><text x="800" y="880" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="17" fill="#526B7A">FIG-N-ICP-002 · 式の限界を含む概念図 · ICP/CPP/TBI SSOTと施設protocolを参照 · 確認日 2026-08-12</text></svg>
