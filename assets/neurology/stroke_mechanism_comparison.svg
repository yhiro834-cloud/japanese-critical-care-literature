<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">急性脳卒中の機序比較</title><desc id="desc">虚血性脳卒中、脳内出血、くも膜下出血の発生部位と共通初期評価を比較する。</desc><rect width="1600" height="900" fill="#f8fafc"/><text x="80" y="80" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="42" font-weight="700" fill="#21374b">急性脳卒中：血管閉塞・脳内出血・くも膜下出血を分ける</text><text x="80" y="122" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="22" fill="#60758a">発症・最終健常時刻と画像で治療経路を分ける。模式図から血管領域を確定しない</text><g font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif"><g fill="#fff" stroke-width="4"><rect x="70" y="180" width="460" height="480" rx="28" stroke="#3d79ad"/><rect x="570" y="180" width="460" height="480" rx="28" stroke="#b24a4a"/><rect x="1070" y="180" width="460" height="480" rx="28" stroke="#8c4d91"/></g><g text-anchor="middle" fill="#21374b"><text x="300" y="235" font-size="29" font-weight="700">虚血性脳卒中</text><text x="800" y="235" font-size="29" font-weight="700">脳内出血</text><text x="1300" y="235" font-size="29" font-weight="700">くも膜下出血</text></g><g><circle cx="300" cy="405" r="130" fill="#e8f2fa" stroke="#3d79ad" stroke-width="5"/><path d="M220 480 Q170 380 250 310 Q350 250 405 355 Q430 455 340 510Z" fill="#c9ddeb"/><path d="M150 405 H280" stroke="#3d79ad" stroke-width="13"/><circle cx="250" cy="405" r="15" fill="#21374b"/><path d="M280 405 Q335 380 380 330" fill="none" stroke="#3d79ad" stroke-width="8" stroke-dasharray="10 8"/><circle cx="800" cy="405" r="130" fill="#f8e9e9" stroke="#b24a4a" stroke-width="5"/><path d="M720 480 Q670 380 750 310 Q850 250 905 355 Q930 455 840 510Z" fill="#ead0d0"/><circle cx="850" cy="395" r="42" fill="#b24a4a"/><circle cx="1300" cy="405" r="130" fill="#f4eaf5" stroke="#8c4d91" stroke-width="5"/><path d="M1220 480 Q1170 380 1250 310 Q1350 250 1405 355 Q1430 455 1340 510Z" fill="#dfcce1"/><path d="M1200 360 Q1300 290 1400 365 M1190 420 Q1300 345 1410 430 M1220 490 Q1300 420 1380 500" fill="none" stroke="#8c4d91" stroke-width="9"/></g><g text-anchor="middle" fill="#21374b"><text x="300" y="585" font-size="21">血管閉塞 → 血流低下</text><text x="800" y="585" font-size="21">脳実質内の出血</text><text x="1300" y="585" font-size="21">脳表面の髄液腔へ出血</text></g><rect x="135" y="720" width="1330" height="100" rx="22" fill="#21374b"/><text x="800" y="758" text-anchor="middle" font-size="22" font-weight="700" fill="white">共通：ABCDE・血糖・最終健常時刻・神経所見・抗血栓薬・緊急画像</text><text x="800" y="792" text-anchor="middle" font-size="18" fill="#d9e5ee">画像前に治療法を決めつけず、低血糖・痙攣・中毒などの類似病態も並行評価</text></g><text x="80" y="865" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="17" fill="#60758a">教育用概念図：実際の血管支配、出血範囲、治療適応は専門画像読影と最新脳卒中手順で判断する。</text></svg>
