<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">VA-ECMO回路</title><desc id="desc">静脈から脱血しpump、oxygenatorを通して動脈へ返血するVA-ECMO回路と、左室負荷、上半身酸素化、下肢虚血の観察点を示す。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#C74440"/></marker></defs><rect width="1600" height="900" fill="#fff"/><text x="80" y="78" font-family="Arial" font-size="42" font-weight="700" fill="#172B3A">VA-ECMO：静脈 → 回路でgas交換・送血 → 動脈</text><text x="80" y="120" font-family="Arial" font-size="24" fill="#526B7A">循環とgas exchangeを補助するが、native heart・肺・返血分布との相互作用がある</text><g font-family="Arial" text-anchor="middle"><circle cx="220" cy="410" r="120" fill="#E7F6EE" stroke="#26734D" stroke-width="7"/><text x="220" y="395" font-size="31" font-weight="700">患者</text><text x="220" y="440" font-size="20">静脈脱血</text><text x="220" y="472" font-size="20" fill="#B21F2D">動脈返血</text><rect x="540" y="320" width="220" height="180" rx="30" fill="#EEEAFE"/><text x="650" y="395" font-size="30" font-weight="700">Pump</text><text x="650" y="440" font-size="21">flow / RPM</text><rect x="930" y="285" width="300" height="250" rx="35" fill="#F2FAFD" stroke="#2B7A9B" stroke-width="7"/><text x="1080" y="375" font-size="30" font-weight="700">Oxygenator</text><text x="1080" y="420" font-size="21">O₂付加・CO₂除去</text><text x="1080" y="465" font-size="21">性能・clot・hemolysis</text></g><path d="M340 380 H520 M780 380 H910" stroke="#31546D" stroke-width="16" fill="none"/><path d="M1250 380 H1430 V650 H220 V550" stroke="#C74440" stroke-width="16" fill="none" marker-end="url(#a)"/><rect x="190" y="690" width="1220" height="125" rx="28" fill="#FFF4F2"/><text x="800" y="732" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#B21F2D">同時監視：LV拡張・aortic valve開放・肺水腫・右上肢酸素化・下肢虚血</text><text x="800" y="773" text-anchor="middle" font-family="Arial" font-size="21" fill="#526B7A">MAP/flowだけでなくpulsatility、echo、灌流、Hb、出血・血栓、出口戦略を統合</text><text x="800" y="880" text-anchor="middle" font-family="Arial" font-size="17" fill="#526B7A">FIG-E-ECMO-002 · peripheral VAの代表概念 · cannulation/monitor部位は施設protocolを優先 · 確認日 2026-08-12</text></svg>
