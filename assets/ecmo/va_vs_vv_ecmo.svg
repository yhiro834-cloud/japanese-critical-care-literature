<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">静脈脱血・静脈送血型（VV-ECMO）と静脈脱血・動脈送血型（VA-ECMO）の比較</title><desc id="desc">静脈脱血・静脈送血型（VV-ECMO）と静脈脱血・動脈送血型（VA-ECMO）の返血先、主な補助対象、直接補助しないもの、重要な観察点を比較する。</desc><rect width="1600" height="900" fill="#fff"/><text x="80" y="78" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="42" font-weight="700" fill="#172B3A">ECMOの方式：呼吸補助型（VV）と呼吸・循環補助型（VA）</text><text x="80" y="120" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="24" fill="#526B7A">方式名だけでなく、どこから脱血しどこへ返血するかを患者ごとに確認</text><g font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif"><rect x="100" y="185" width="650" height="525" rx="35" fill="#F2FAFD" stroke="#2B7A9B" stroke-width="7"/><text x="425" y="255" text-anchor="middle" font-size="36" font-weight="700" fill="#2B7A9B">静脈脱血・静脈送血型（VV-ECMO）</text><text x="160" y="330" font-size="25" font-weight="700">経路</text><text x="300" y="330" font-size="24">静脈 → 回路 → 静脈</text><text x="160" y="395" font-size="25" font-weight="700">主に支える</text><text x="330" y="395" font-size="24">酸素化・CO₂除去</text><text x="160" y="460" font-size="25" font-weight="700">直接支えない</text><text x="340" y="460" font-size="24">循環（ポンプ機能）</text><text x="160" y="535" font-size="23">重要：再循環、自己肺、</text><text x="160" y="575" font-size="23">心拍出量、Hb、酸素需要</text><rect x="850" y="185" width="650" height="525" rx="35" fill="#FFF3F1" stroke="#C74440" stroke-width="7"/><text x="1175" y="255" text-anchor="middle" font-size="36" font-weight="700" fill="#C74440">静脈脱血・動脈送血型（VA-ECMO）</text><text x="910" y="330" font-size="25" font-weight="700">経路</text><text x="1050" y="330" font-size="24">静脈 → 回路 → 動脈</text><text x="910" y="395" font-size="25" font-weight="700">主に支える</text><text x="1080" y="395" font-size="24">循環＋ガス交換</text><text x="910" y="460" font-size="25" font-weight="700">新たな課題</text><text x="1080" y="460" font-size="24">LV後負荷・返血分布</text><text x="910" y="535" font-size="23">重要：左室拡張、肺水腫、</text><text x="910" y="575" font-size="23">上半身酸素化、下肢灌流</text></g><rect x="180" y="760" width="1240" height="75" rx="24" fill="#EAF2F7"/><text x="800" y="807" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="25" font-weight="700" fill="#172B3A">共通：原因治療・臓器保護・出血/血栓・回路安全・毎日の治療目標・離脱計画再評価</text><text x="800" y="880" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="17" fill="#526B7A">FIG-E-ECMO-003 · 個々のカニューレ配置構成を確認 · ELSO guidanceと施設protocolを優先 · 確認日 2026-08-12</text></svg>
