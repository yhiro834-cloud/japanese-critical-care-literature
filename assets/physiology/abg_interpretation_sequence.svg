<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">動脈血液ガスを順序立てて解釈する</title><desc id="desc">動脈血液ガスを、患者と採血条件、pH、二酸化炭素分圧と重炭酸、代償と混合性、酸素化、臨床原因、再評価の順に読む方法を示す。</desc>
  <defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#31546D"/></marker></defs><rect width="1600" height="900" fill="#fff"/>
  <text x="70" y="70" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="42" font-weight="700" fill="#172B3A">動脈血液ガス：数値を患者の病態へ戻して読む</text><text x="70" y="114" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="23" fill="#526B7A">採血条件と時間を確認し、酸塩基・換気・酸素化を混同しない</text>
  <g font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif"><rect x="70" y="170" width="460" height="155" rx="28" fill="#EAF2F7"/><text x="300" y="218" text-anchor="middle" font-size="27" font-weight="700" fill="#31546D">1 患者と採血条件</text><text x="105" y="265" font-size="20">意識・呼吸仕事量・循環・体温・時刻</text><text x="105" y="300" font-size="20">吸入酸素濃度・人工呼吸器設定・検体</text><rect x="570" y="170" width="460" height="155" rx="28" fill="#FFF2D9"/><text x="800" y="218" text-anchor="middle" font-size="27" font-weight="700" fill="#8A5A00">2 pHで方向を確認</text><text x="605" y="265" font-size="20">酸性側か、アルカリ性側か</text><text x="605" y="300" font-size="20">正常範囲でも混合性異常はあり得る</text><rect x="1070" y="170" width="460" height="155" rx="28" fill="#EEEAFE"/><text x="1300" y="218" text-anchor="middle" font-size="27" font-weight="700" fill="#51459B">3 主な変化を分ける</text><text x="1105" y="265" font-size="20">二酸化炭素分圧：呼吸性の変化</text><text x="1105" y="300" font-size="20">重炭酸：代謝性の変化</text>
  <rect x="70" y="430" width="460" height="155" rx="28" fill="#E7F6EE"/><text x="300" y="478" text-anchor="middle" font-size="27" font-weight="700" fill="#26734D">4 代償と混合性</text><text x="105" y="525" font-size="20">予想される代償と実測値を比較</text><text x="105" y="560" font-size="20">合わなければ二重・三重異常を考える</text><rect x="570" y="430" width="460" height="155" rx="28" fill="#F2FAFD"/><text x="800" y="478" text-anchor="middle" font-size="27" font-weight="700" fill="#31546D">5 酸素化を別に評価</text><text x="605" y="525" font-size="20">動脈血酸素分圧・吸入酸素濃度</text><text x="605" y="560" font-size="20">ヘモグロビン・循環・測定条件も統合</text><rect x="1070" y="430" width="460" height="155" rx="28" fill="#FDE9E8"/><text x="1300" y="478" text-anchor="middle" font-size="27" font-weight="700" fill="#B21F2D">6 原因と緊急性</text><text x="1105" y="525" font-size="20">気道・肺・循環・代謝・腎・薬剤</text><text x="1105" y="560" font-size="20">数値より先に治療すべき危機を確認</text></g>
  <g stroke="#31546D" stroke-width="4" marker-end="url(#a)"><path d="M533 247 H562"/><path d="M1033 247 H1062"/><path d="M1300 330 V402"/><path d="M1062 507 H1033"/><path d="M562 507 H533"/></g>
  <rect x="120" y="680" width="1360" height="115" rx="26" fill="#F4F7F9"/><text x="800" y="725" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="25" font-weight="700" fill="#172B3A">介入後は、患者所見と同じ採血条件で再評価し、期待した変化と害を確認する</text><text x="800" y="765" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="19" fill="#526B7A">ABG＝arterial blood gas analysis（動脈血液ガス分析）。一つの値だけで診断しない。</text><text x="800" y="862" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="17" fill="#526B7A">FIG-P-ABG-001・AARC Blood Gas Analysis Guideline／ABG SSOT・確認日 2026-08-12</text>
</svg>
