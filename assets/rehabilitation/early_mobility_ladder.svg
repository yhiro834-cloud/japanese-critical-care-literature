<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">ICU早期離床の段階と安全確認</title><desc id="desc">体位変換、関節運動、ベッドアップ、端座位、立位、歩行へ段階的に進み、各段階で循環、呼吸、神経、機器、症状、回復を評価する。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#31546D"/></marker></defs><rect width="1600" height="900" fill="#fff"/>
  <text x="70" y="72" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="42" font-weight="700" fill="#172B3A">早期離床：歩行だけでなく、その患者に安全な「次の一段」を選ぶ</text><text x="70" y="116" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="23" fill="#526B7A">開始前評価、機器計画、実施中の中止基準、実施後の回復を同じ記録にする</text>
  <g font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" text-anchor="middle"><rect x="70" y="560" width="230" height="170" rx="24" fill="#EAF2F7"/><text x="185" y="615" font-size="25" font-weight="700">1 体位変換</text><text x="185" y="660" font-size="19">除圧・呼吸・覚醒</text><rect x="320" y="490" width="230" height="240" rx="24" fill="#F2FAFD"/><text x="435" y="545" font-size="25" font-weight="700">2 関節運動</text><text x="435" y="590" font-size="19">自動／他動・筋力</text><rect x="570" y="420" width="230" height="310" rx="24" fill="#FFF2D9"/><text x="685" y="475" font-size="25" font-weight="700">3 ベッドアップ</text><text x="685" y="520" font-size="19">呼吸・循環耐容性</text><rect x="820" y="350" width="230" height="380" rx="24" fill="#EEEAFE"/><text x="935" y="405" font-size="25" font-weight="700">4 端座位</text><text x="935" y="450" font-size="19">体幹・意識・血圧</text><rect x="1070" y="280" width="230" height="450" rx="24" fill="#E7F6EE"/><text x="1185" y="335" font-size="25" font-weight="700">5 立位・移乗</text><text x="1185" y="380" font-size="19">支持・ライン・症状</text><rect x="1320" y="210" width="230" height="520" rx="24" fill="#FDE9E8"/><text x="1435" y="265" font-size="25" font-weight="700">6 歩行</text><text x="1435" y="310" font-size="19">距離より安全と回復</text></g>
  <g stroke="#31546D" stroke-width="7" marker-end="url(#a)"><path d="M300 645 H310"/><path d="M550 610 H560"/><path d="M800 575 H810"/><path d="M1050 540 H1060"/><path d="M1300 505 H1310"/></g>
  <rect x="100" y="150" width="1110" height="160" rx="28" fill="#F4F7F9"/><text x="655" y="195" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="27" font-weight="700" fill="#172B3A">開始前と実施中に確認</text><text x="145" y="240" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="21">呼吸：酸素化・換気・呼吸努力　循環：調律・血圧・灌流　神経：覚醒・指示理解・新規症状</text><text x="145" y="278" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="21">機器：気道・回路・カテーテル・ドレーン・ポンプ・予備電源　人員：役割・中止合図・戻る方法</text>
  <rect x="180" y="780" width="1240" height="62" rx="22" fill="#EAF2F7"/><text x="800" y="820" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="23" font-weight="700" fill="#172B3A">実施できなかった理由も記録し、鎮静・疼痛・時間帯・人員・機器配置など修正可能な障壁を減らす</text><text x="800" y="880" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="17" fill="#526B7A">FIG-REHAB-001 · 早期離床・PICS SSOTを参照 · 個別の中止基準は施設手順で設定 · 確認日 2026-08-12</text></svg>
