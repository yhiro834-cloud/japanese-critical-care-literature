<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">外傷で見えない大出血を探す体腔図</title><desc id="desc">外傷性出血の主要候補である胸腔、腹腔・後腹膜、骨盤、長管骨、体外を人体模式図上に示す。</desc><rect width="1600" height="900" fill="#faf8f6"/><text x="75" y="80" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="42" font-weight="700" fill="#3e3130">外傷性ショック：見える出血だけでなく「血液が隠れる場所」を探す</text><g transform="translate(170 155)" stroke="#514746" stroke-width="5"><circle cx="330" cy="75" r="65" fill="#f2d4c9"/><path d="M245 150 Q330 110 415 150 L465 500 Q390 580 330 580 Q270 580 195 500Z" fill="#f2d4c9"/><path d="M245 175 Q330 145 415 175 L425 310 Q330 350 235 310Z" fill="#e7b8b0"/><path d="M235 325 Q330 300 425 325 L445 465 Q330 500 215 465Z" fill="#f3c7a9"/><path d="M225 470 Q330 440 435 470 L410 550 Q330 585 250 550Z" fill="#dab3c9"/><path d="M250 550 L235 720"/><path d="M410 550 L425 720"/><path d="M205 190 L110 500"/><path d="M455 190 L550 500"/></g><g font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif"><g fill="#fff" stroke="#a94b46" stroke-width="4"><rect x="790" y="170" width="650" height="95" rx="18"/><rect x="790" y="290" width="650" height="95" rx="18"/><rect x="790" y="410" width="650" height="95" rx="18"/><rect x="790" y="530" width="650" height="95" rx="18"/><rect x="790" y="650" width="650" height="95" rx="18"/></g><g fill="#3e3130"><text x="830" y="210" font-size="25" font-weight="700">胸腔</text><text x="1030" y="210" font-size="21">大量血胸、心嚢内出血</text><text x="830" y="330" font-size="25" font-weight="700">腹腔・後腹膜</text><text x="1030" y="330" font-size="21">肝・脾・腎・大血管・腸間膜</text><text x="830" y="450" font-size="25" font-weight="700">骨盤</text><text x="1030" y="450" font-size="21">骨折面・静脈叢・動脈</text><text x="830" y="570" font-size="25" font-weight="700">長管骨・軟部組織</text><text x="1080" y="570" font-size="21">大腿骨など</text><text x="830" y="690" font-size="25" font-weight="700">体外</text><text x="1030" y="690" font-size="21">頭皮・創・切断部・現場出血</text></g></g><rect x="150" y="805" width="1300" height="55" rx="15" fill="#a94b46"/><text x="800" y="841" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="21" font-weight="700" fill="white">単一の陰性検査で除外せず、機転・灌流・反復診察・画像・介入反応を統合する</text></svg>
