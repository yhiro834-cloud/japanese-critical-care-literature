<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ABCDE Exposure detail</title><desc id="desc">Exposure assessment covers temperature, skin, bleeding, infection, trauma, devices and environment while preserving warmth and dignity.</desc>
