<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ABCDE Circulation detail</title><desc id="desc">Circulation assessment integrates pressure, flow and tissue perfusion before phenotype-directed action and reassessment.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5B5BD6"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/><rect width="1600" height="145" fill="#FFF2D9"/><text x="80" y="70" font-family="Arial" font-size="44" font-weight="700" fill="#D97706">C · Circulation</text><text x="80" y="112" font-family="Arial" font-size="24" fill="#172B3A">Blood pressureは入口。FlowとTissue perfusionを同じtimelineで見る</text>
  <g font-family="Arial">
    <rect x="90" y="205" width="400" height="300" rx="28" fill="#F4F8FA" stroke="#31546D" stroke-width="4"/><text x="290" y="260" text-anchor="middle" font-size="30" font-weight="700" fill="#31546D">PRESSURE / RHYTHM</text><text x="130" y="320" font-size="24" fill="#172B3A"><tspan x="130">Pulse + ECG rhythm</tspan><tspan x="130" dy="52">BP / MAP + waveform validity</tspan><tspan x="130" dy="52">Pulse pressure / trend</tspan></text>
    <rect x="600" y="205" width="400" height="300" rx="28" fill="#F4F8FA" stroke="#1976A3" stroke-width="4"/><text x="800" y="260" text-anchor="middle" font-size="30" font-weight="700" fill="#1976A3">FLOW / CONGESTION</text><text x="640" y="320" font-size="24" fill="#172B3A"><tspan x="640">Stroke volume / echo context</tspan><tspan x="640" dy="52">JVP · lung · edema</tspan><tspan x="640" dy="52">Bleeding / fluid balance</tspan></text>
    <rect x="1110" y="205" width="400" height="300" rx="28" fill="#F4F8FA" stroke="#16856B" stroke-width="4"/><text x="1310" y="260" text-anchor="middle" font-size="30" font-weight="700" fill="#16856B">TISSUE PERFUSION</text><text x="1150" y="320" font-size="24" fill="#172B3A"><tspan x="1150">CRT · skin · temperature</tspan><tspan x="1150" dy="52">Mentation · urine output</tspan><tspan x="1150" dy="52">Lactate / organ trajectory</tspan></text>
  </g>
  <path d="M490 355H590M1000 355H1100" stroke="#5B5BD6" stroke-width="6" marker-end="url(#a)"/>
  <rect x="150" y="585" width="540" height="130" rx="25" fill="#FFF4F2" stroke="#C74440" stroke-width="4"/><text x="185" y="635" font-family="Arial" font-size="28" font-weight="700" fill="#C74440">UNSTABLE / HYPOPERFUSION</text><text x="185" y="680" font-family="Arial" font-size="22" fill="#172B3A">bleeding · arrhythmia · obstruction · pump failure</text>
  <rect x="910" y="585" width="540" height="130" rx="25" fill="#E6F5F2" stroke="#16856B" stroke-width="4"/><text x="945" y="635" font-family="Arial" font-size="28" font-weight="700" fill="#16856B">PHENOTYPE-DIRECTED ACTION</text><text x="945" y="680" font-family="Arial" font-size="23" fill="#172B3A">cause control + support; do not use blind fluid</text>
  <path d="M690 650H900" stroke="#5B5BD6" stroke-width="6" marker-end="url(#a)"/>
  <text x="800" y="790" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#5B5BD6">Reassess pressure + flow + perfusion — not MAP alone</text>
  <text x="80" y="850" font-family="Arial" font-size="19" fill="#526B7A">FIG-G-ABCDE-004 · SSOT: Circulation / Shock / Hemodynamics · Reviewed 2026-08-12</text>
</svg>
