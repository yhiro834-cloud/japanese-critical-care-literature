<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ABCDE Circulation detail</title><desc id="desc">Circulation assessment integrates pressure, flow and tissue perfusion before phenotype-directed action and reassessment.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5B5BD6"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/><rect width="1600" height="145" fill="#FFF2D9"/><text x="80" y="70" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="44" font-weight="700" fill="#D97706">C · 循環（Circulation）</text><text x="80" y="112" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="24" fill="#172B3A">血圧は入口。血流とうっ血、組織灌流を同じ時間軸で見る</text>
  <g font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif">
    <rect x="90" y="205" width="400" height="300" rx="28" fill="#F4F8FA" stroke="#31546D" stroke-width="4"/><text x="290" y="260" text-anchor="middle" font-size="30" font-weight="700" fill="#31546D">圧・リズム</text><text x="130" y="320" font-size="24" fill="#172B3A"><tspan x="130">脈拍・ECGリズム</tspan><tspan x="130" dy="52">BP / MAP・波形の妥当性</tspan><tspan x="130" dy="52">脈圧・推移</tspan></text>
    <rect x="600" y="205" width="400" height="300" rx="28" fill="#F4F8FA" stroke="#1976A3" stroke-width="4"/><text x="800" y="260" text-anchor="middle" font-size="30" font-weight="700" fill="#1976A3">血流・うっ血</text><text x="640" y="320" font-size="24" fill="#172B3A"><tspan x="640">一回拍出量・心エコー所見</tspan><tspan x="640" dy="52">JVP・肺・浮腫</tspan><tspan x="640" dy="52">出血・水分バランス</tspan></text>
    <rect x="1110" y="205" width="400" height="300" rx="28" fill="#F4F8FA" stroke="#16856B" stroke-width="4"/><text x="1310" y="260" text-anchor="middle" font-size="30" font-weight="700" fill="#16856B">組織灌流</text><text x="1150" y="320" font-size="24" fill="#172B3A"><tspan x="1150">CRT・皮膚・体温</tspan><tspan x="1150" dy="52">意識・尿量</tspan><tspan x="1150" dy="52">Lactate・臓器の推移</tspan></text>
  </g>
  <path d="M490 355H590M1000 355H1100" stroke="#5B5BD6" stroke-width="6" marker-end="url(#a)"/>
  <rect x="150" y="585" width="540" height="130" rx="25" fill="#FFF4F2" stroke="#C74440" stroke-width="4"/><text x="185" y="635" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="28" font-weight="700" fill="#C74440">不安定・低灌流</text><text x="185" y="680" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="22" fill="#172B3A">出血・不整脈・閉塞・心ポンプ不全</text>
  <rect x="910" y="585" width="540" height="130" rx="25" fill="#E6F5F2" stroke="#16856B" stroke-width="4"/><text x="945" y="635" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="28" font-weight="700" fill="#16856B">病態に応じた対応</text><text x="945" y="680" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="23" fill="#172B3A">原因治療＋全身管理・盲目的な輸液を避ける</text>
  <path d="M690 650H900" stroke="#5B5BD6" stroke-width="6" marker-end="url(#a)"/>
  <text x="800" y="790" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="28" font-weight="700" fill="#5B5BD6">MAPだけでなく、圧＋血流＋組織灌流を再評価</text>
  <text x="80" y="850" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="19" fill="#526B7A">FIG-G-ABCDE-004 · SSOT: 循環・Shock・血行動態 · 確認日 2026-08-12</text>
</svg>
