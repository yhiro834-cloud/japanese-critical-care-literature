<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ABCDE Breathing detail</title><desc id="desc">Breathing is divided into oxygenation, ventilation and work of breathing, followed by red flags, support and reassessment.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5B5BD6"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/><rect width="1600" height="145" fill="#E6F5F2"/><text x="80" y="70" font-family="Arial" font-size="44" font-weight="700" fill="#16856B">B · Breathing</text><text x="80" y="112" font-family="Arial" font-size="24" fill="#172B3A">Oxygenation・Ventilation・Work of breathingを別々に評価する</text>
  <g font-family="Arial">
    <rect x="85" y="200" width="410" height="300" rx="28" fill="#F4F8FA" stroke="#1976A3" stroke-width="4"/><text x="290" y="255" text-anchor="middle" font-size="30" font-weight="700" fill="#1976A3">OXYGENATION</text><text x="125" y="315" font-size="24" fill="#172B3A"><tspan x="125">SpO₂ trend + signal</tspan><tspan x="125" dy="50">FiO₂ / oxygen device</tspan><tspan x="125" dy="50">Skin · chest · ABG context</tspan></text>
    <rect x="595" y="200" width="410" height="300" rx="28" fill="#F4F8FA" stroke="#5B5BD6" stroke-width="4"/><text x="800" y="255" text-anchor="middle" font-size="30" font-weight="700" fill="#5B5BD6">VENTILATION</text><text x="635" y="315" font-size="24" fill="#172B3A"><tspan x="635">Respiratory rate / depth</tspan><tspan x="635" dy="50">ETCO₂ waveform + trend</tspan><tspan x="635" dy="50">PaCO₂ / pH when needed</tspan></text>
    <rect x="1105" y="200" width="410" height="300" rx="28" fill="#F4F8FA" stroke="#D97706" stroke-width="4"/><text x="1310" y="255" text-anchor="middle" font-size="30" font-weight="700" fill="#D97706">WORK</text><text x="1145" y="315" font-size="24" fill="#172B3A"><tspan x="1145">Effort · accessory muscles</tspan><tspan x="1145" dy="50">Synchrony · fatigue</tspan><tspan x="1145" dy="50">Breath sounds / asymmetry</tspan></text>
  </g>
  <path d="M495 350H585M1005 350H1095" stroke="#5B5BD6" stroke-width="5" stroke-dasharray="12 8" marker-end="url(#a)"/>
  <rect x="120" y="570" width="620" height="150" rx="24" fill="#FFF4F2" stroke="#C74440" stroke-width="4"/><text x="155" y="615" font-family="Arial" font-size="28" font-weight="700" fill="#C74440">RED FLAGS</text><text x="155" y="655" font-family="Arial" font-size="22" fill="#172B3A"><tspan x="155">apnea · exhaustion · silent chest</tspan><tspan x="155" dy="34">severe hypoxemia · sudden asymmetry</tspan></text>
  <rect x="860" y="570" width="620" height="150" rx="24" fill="#E6F5F2" stroke="#16856B" stroke-width="4"/><text x="895" y="615" font-family="Arial" font-size="28" font-weight="700" fill="#16856B">SUPPORT + CAUSE</text><text x="895" y="655" font-family="Arial" font-size="22" fill="#172B3A"><tspan x="895">position · oxygen / ventilation · device check</tspan><tspan x="895" dy="34">targeted treatment + response</tspan></text>
  <path d="M740 640H850" stroke="#5B5BD6" stroke-width="6" marker-end="url(#a)"/>
  <text x="800" y="790" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#5B5BD6">Reassess all three domains after every change</text>
  <text x="80" y="850" font-family="Arial" font-size="19" fill="#526B7A">FIG-G-ABCDE-003 · Educational framework; targets are patient- and protocol-specific · Reviewed 2026-08-12</text>
</svg>
