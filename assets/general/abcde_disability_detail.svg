<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ABCDE Disability detail</title><desc id="desc">Disability assessment checks consciousness, pupils, motor findings, glucose, seizures and confounders, then escalates urgent threats.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5B5BD6"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/><rect width="1600" height="145" fill="#EEEAFE"/><text x="80" y="70" font-family="Arial" font-size="44" font-weight="700" fill="#5B5BD6">D · 神経・意識（Disability）</text><text x="80" y="112" font-family="Arial" font-size="24" fill="#172B3A">意識の数値だけでなく、左右差・瞳孔・可逆原因・交絡を確認</text>
  <g font-family="Arial">
    <rect x="80" y="205" width="460" height="360" rx="28" fill="#F4F8FA" stroke="#31546D" stroke-width="4"/><text x="115" y="260" font-size="29" font-weight="700" fill="#31546D">迅速評価</text><text x="120" y="320" font-size="24" fill="#172B3A"><tspan x="120">• GCS / JCS・通常時との比較</tspan><tspan x="120" dy="50">• 瞳孔：大きさ・左右差・反応</tspan><tspan x="120" dy="50">• 顔面・四肢：局在症状</tspan><tspan x="120" dy="50">• 血糖・体温</tspan><tspan x="120" dy="50">• 痙攣活動</tspan></text>
    <rect x="570" y="205" width="460" height="360" rx="28" fill="#FFF4F2" stroke="#C74440" stroke-width="4"/><text x="605" y="260" font-size="29" font-weight="700" fill="#C74440">危険な徴候</text><text x="610" y="320" font-size="24" fill="#172B3A"><tspan x="610">◆ 突然の意識低下</tspan><tspan x="610" dy="50">◆ 新規の瞳孔不同</tspan><tspan x="610" dy="50">◆ 局在症状</tspan><tspan x="610" dy="50">◆ 痙攣の持続</tspan><tspan x="610" dy="50">◆ 気道防御不能</tspan></text>
    <rect x="1060" y="205" width="460" height="360" rx="28" fill="#E6F5F2" stroke="#16856B" stroke-width="4"/><text x="1095" y="260" font-size="29" font-weight="700" fill="#16856B">対応＋原因確認</text><text x="1100" y="320" font-size="24" fill="#172B3A"><tspan x="1100">1  ABC・低血糖へ対応</tspan><tspan x="1100" dy="50">2  進行中の二次損傷を止める</tspan><tspan x="1100" dy="50">3  脳卒中・痙攣経路</tspan><tspan x="1100" dy="50">4  薬剤・代謝を確認</tspan><tspan x="1100" dy="50">5  適応に応じ画像・EEG</tspan></text>
  </g>
  <path d="M540 385H560M1030 385H1050" stroke="#5B5BD6" stroke-width="6" marker-end="url(#a)"/>
  <rect x="250" y="640" width="1100" height="125" rx="28" fill="#F6F7FF" stroke="#5B5BD6" stroke-width="4"/><text x="800" y="685" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#5B5BD6">交絡を含めて再評価</text><text x="800" y="730" text-anchor="middle" font-family="Arial" font-size="23" fill="#172B3A">鎮静・鎮痛・NMBA・PaCO₂・体温・臓器不全</text>
  <text x="80" y="850" font-family="Arial" font-size="19" fill="#526B7A">FIG-G-ABCDE-005 · スコアは評価の補助。診断・予後を置換しない · 確認日 2026-08-12</text>
</svg>
