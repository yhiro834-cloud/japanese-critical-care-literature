<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ABCDE Disability detail</title><desc id="desc">Disability assessment checks consciousness, pupils, motor findings, glucose, seizures and confounders, then escalates urgent threats.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5B5BD6"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/><rect width="1600" height="145" fill="#EEEAFE"/><text x="80" y="70" font-family="Arial" font-size="44" font-weight="700" fill="#5B5BD6">D · Disability</text><text x="80" y="112" font-family="Arial" font-size="24" fill="#172B3A">意識の数値だけでなく、左右差・瞳孔・可逆原因・交絡を確認</text>
  <g font-family="Arial">
    <rect x="80" y="205" width="460" height="360" rx="28" fill="#F4F8FA" stroke="#31546D" stroke-width="4"/><text x="115" y="260" font-size="29" font-weight="700" fill="#31546D">RAPID CHECK</text><text x="120" y="320" font-size="24" fill="#172B3A"><tspan x="120">• GCS / JCS + baseline</tspan><tspan x="120" dy="50">• Pupils: size / symmetry / response</tspan><tspan x="120" dy="50">• Face / limbs: focal deficit</tspan><tspan x="120" dy="50">• Glucose / temperature</tspan><tspan x="120" dy="50">• Seizure activity</tspan></text>
    <rect x="570" y="205" width="460" height="360" rx="28" fill="#FFF4F2" stroke="#C74440" stroke-width="4"/><text x="605" y="260" font-size="29" font-weight="700" fill="#C74440">RED FLAGS</text><text x="610" y="320" font-size="24" fill="#172B3A"><tspan x="610">◆ Sudden decline</tspan><tspan x="610" dy="50">◆ New anisocoria</tspan><tspan x="610" dy="50">◆ Focal deficit</tspan><tspan x="610" dy="50">◆ Ongoing seizure</tspan><tspan x="610" dy="50">◆ Cannot protect airway</tspan></text>
    <rect x="1060" y="205" width="460" height="360" rx="28" fill="#E6F5F2" stroke="#16856B" stroke-width="4"/><text x="1095" y="260" font-size="29" font-weight="700" fill="#16856B">ACT + CLARIFY</text><text x="1100" y="320" font-size="24" fill="#172B3A"><tspan x="1100">1  ABC / glucose rescue</tspan><tspan x="1100" dy="50">2  Stop ongoing injury</tspan><tspan x="1100" dy="50">3  Stroke / seizure pathway</tspan><tspan x="1100" dy="50">4  Drug / metabolic review</tspan><tspan x="1100" dy="50">5  Imaging / EEG as indicated</tspan></text>
  </g>
  <path d="M540 385H560M1030 385H1050" stroke="#5B5BD6" stroke-width="6" marker-end="url(#a)"/>
  <rect x="250" y="640" width="1100" height="125" rx="28" fill="#F6F7FF" stroke="#5B5BD6" stroke-width="4"/><text x="800" y="685" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#5B5BD6">REASSESS WITH CONFOUNDERS</text><text x="800" y="730" text-anchor="middle" font-family="Arial" font-size="23" fill="#172B3A">sedation · analgesia · NMBA · PaCO₂ · temperature · organ failure</text>
  <text x="80" y="850" font-family="Arial" font-size="19" fill="#526B7A">FIG-G-ABCDE-005 · Scores support assessment; they do not replace diagnosis or prognosis · Reviewed 2026-08-12</text>
</svg>
