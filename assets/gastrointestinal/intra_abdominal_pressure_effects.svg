<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">腹腔内圧上昇による多臓器への影響</title><desc id="desc">腹腔内圧上昇が横隔膜、静脈還流、腎灌流、消化管および測定値へ及ぼす影響と再評価を示す。</desc><rect width="1600" height="900" fill="#f8fafc"/><text x="80" y="80" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="42" font-weight="700" fill="#26384b">腹腔内圧上昇：腹部だけでなく呼吸・循環・腎臓へ波及する</text><ellipse cx="800" cy="450" rx="260" ry="285" fill="#fff1df" stroke="#c4772f" stroke-width="6"/><text x="800" y="405" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="31" font-weight="700" fill="#6e451f">腹腔内圧 ↑</text><path d="M660 500 Q800 400 940 500 Q900 620 800 650 Q700 620 660 500Z" fill="#efc18d"/><text x="800" y="555" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="22" fill="#6e451f">内容量増加・浮腫・出血</text><g font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif"><g fill="#fff" stroke="#527ba1" stroke-width="4"><rect x="70" y="185" width="390" height="150" rx="22"/><rect x="1140" y="185" width="390" height="150" rx="22"/><rect x="70" y="565" width="390" height="150" rx="22"/><rect x="1140" y="565" width="390" height="150" rx="22"/></g><g text-anchor="middle" fill="#26384b"><text x="265" y="235" font-size="26" font-weight="700">呼吸</text><text x="265" y="277" font-size="20">横隔膜挙上・肺容量低下</text><text x="265" y="309" font-size="20">気道内圧上昇・低酸素</text><text x="1335" y="235" font-size="26" font-weight="700">循環</text><text x="1335" y="277" font-size="20">静脈還流・心拍出への影響</text><text x="1335" y="309" font-size="20">見かけの充満圧上昇</text><text x="265" y="615" font-size="26" font-weight="700">腎臓</text><text x="265" y="657" font-size="20">腎灌流低下・静脈うっ血</text><text x="265" y="689" font-size="20">尿量低下</text><text x="1335" y="615" font-size="26" font-weight="700">消化管・腹壁</text><text x="1335" y="657" font-size="20">灌流低下・浮腫</text><text x="1335" y="689" font-size="20">閉鎖困難・組織障害</text></g></g><g stroke="#527ba1" stroke-width="6" fill="none"><path d="M600 320 L455 275"/><path d="M1000 320 L1145 275"/><path d="M600 585 L455 640"/><path d="M1000 585 L1145 640"/></g><rect x="330" y="770" width="940" height="75" rx="20" fill="#26384b"/><text x="800" y="802" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="21" font-weight="700" fill="white">測定条件を揃える → 臓器障害と推移を統合 → 原因治療・減圧を検討</text><text x="800" y="830" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="17" fill="#d8e4ec">単一の圧値だけで診断や処置を決めない</text></svg>
