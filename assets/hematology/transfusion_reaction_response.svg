<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">輸血反応を疑うときの初期対応</title><desc id="desc">輸血中の異常を認識し、輸血停止、静脈路確保、患者評価、照合、連絡、検査へ進む安全手順。</desc><rect width="1600" height="900" fill="#fcfaf9"/><text x="80" y="80" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="42" font-weight="700" fill="#432f35">輸血中の異常：原因を決める前に、患者を守り製剤を止める</text><rect x="90" y="145" width="1420" height="100" rx="20" fill="#a53f52"/><text x="800" y="187" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="25" font-weight="700" fill="white">発熱・悪寒・呼吸困難・低血圧・疼痛・蕁麻疹・暗色尿</text><text x="800" y="221" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="19" fill="#ffe9ed">重症患者の基礎疾患だけと決めつけない</text><g font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif"><g fill="#fff" stroke="#a53f52" stroke-width="4"><rect x="80" y="315" width="250" height="180" rx="24"/><rect x="380" y="315" width="250" height="180" rx="24"/><rect x="680" y="315" width="250" height="180" rx="24"/><rect x="980" y="315" width="250" height="180" rx="24"/><rect x="1280" y="315" width="240" height="180" rx="24"/></g><g text-anchor="middle" fill="#432f35"><text x="205" y="365" font-size="27" font-weight="700">1 輸血停止</text><text x="205" y="410" font-size="20">製剤を外し</text><text x="205" y="443" font-size="20">再開しない</text><text x="505" y="365" font-size="27" font-weight="700">2 患者評価</text><text x="505" y="410" font-size="20">ABCDE・症状</text><text x="505" y="443" font-size="20">バイタル・尿</text><text x="805" y="365" font-size="27" font-weight="700">3 静脈路維持</text><text x="805" y="410" font-size="20">施設手順に従い</text><text x="805" y="443" font-size="20">必要な治療を開始</text><text x="1105" y="365" font-size="27" font-weight="700">4 再照合・連絡</text><text x="1105" y="410" font-size="20">患者・製剤・記録</text><text x="1105" y="443" font-size="20">医師・輸血部門</text><text x="1400" y="365" font-size="27" font-weight="700">5 検査・記録</text><text x="1400" y="410" font-size="20">検体・製剤返却</text><text x="1400" y="443" font-size="20">時刻と反応</text></g></g><g stroke="#a53f52" stroke-width="5"><path d="M330 405H380"/><path d="M630 405H680"/><path d="M930 405H980"/><path d="M1230 405H1280"/></g><rect x="155" y="585" width="600" height="190" rx="24" fill="#eef6fb" stroke="#44789a" stroke-width="4"/><text x="455" y="635" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="27" font-weight="700" fill="#294a60">呼吸悪化の主な鑑別</text><text x="205" y="685" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="21" fill="#294a60">• 輸血関連急性肺障害（TRALI）</text><text x="205" y="725" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="21" fill="#294a60">• 輸血関連循環過負荷（TACO）</text><rect x="845" y="585" width="600" height="190" rx="24" fill="#fff3e8" stroke="#ba743b" stroke-width="4"/><text x="1145" y="635" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="27" font-weight="700" fill="#68401f">同時に除外する重篤反応</text><text x="895" y="685" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="21" fill="#68401f">• 急性溶血・アナフィラキシー</text><text x="895" y="725" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="21" fill="#68401f">• 細菌汚染・敗血症</text><text x="80" y="850" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="17" fill="#6c5c61">教育用概念図：反応の診断と治療は時間、出納、循環・呼吸所見、画像、検査を統合し、施設の輸血手順に従う。</text></svg>
