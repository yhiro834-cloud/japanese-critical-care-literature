<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">安全を高める学習システム</title><desc id="desc">事象を個人の注意不足で終わらせず、設計改善、測定、再評価へ循環させる図。</desc><rect width="1600" height="900" fill="#f7faf9"/><text x="80" y="80" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="42" font-weight="700" fill="#203c3c">安全は「もっと注意」でなく、失敗から守る仕組みで高める</text><circle cx="800" cy="480" r="155" fill="#fff" stroke="#2c7a7b" stroke-width="5"/><text x="800" y="445" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="28" font-weight="700" fill="#203c3c">患者を守る</text><text x="800" y="486" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="21" fill="#385b5b">間違いにくい</text><text x="800" y="520" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="21" fill="#385b5b">起きても検出できる</text><text x="800" y="554" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="21" fill="#385b5b">害を小さくできる</text><g font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif"><g fill="#e8f4f4" stroke="#2c7a7b" stroke-width="4"><rect x="110" y="190" width="340" height="180" rx="25"/><rect x="625" y="115" width="350" height="160" rx="25"/><rect x="1150" y="190" width="340" height="180" rx="25"/><rect x="1150" y="615" width="340" height="180" rx="25"/><rect x="625" y="690" width="350" height="150" rx="25"/><rect x="110" y="615" width="340" height="180" rx="25"/></g><g text-anchor="middle" fill="#203c3c"><text x="280" y="245" font-size="27" font-weight="700">1 事実を捉える</text><text x="280" y="288" font-size="20">事象・ヒヤリハット</text><text x="280" y="323" font-size="20">患者への影響</text><text x="800" y="170" font-size="27" font-weight="700">2 背景を分解</text><text x="800" y="211" font-size="20">作業・機器・環境・人員</text><text x="800" y="242" font-size="20">連携・方針・潜在条件</text><text x="1320" y="245" font-size="27" font-weight="700">3 対策を設計</text><text x="1320" y="288" font-size="20">標準化・物理的制約</text><text x="1320" y="323" font-size="20">警告・訓練・予備系</text><text x="1320" y="670" font-size="27" font-weight="700">4 小さく試す</text><text x="1320" y="713" font-size="20">担当・対象・期間を明確化</text><text x="1320" y="748" font-size="20">現場の負担も観察</text><text x="800" y="742" font-size="27" font-weight="700">5 測定する</text><text x="800" y="783" font-size="20">過程・転帰・別の害</text><text x="280" y="670" font-size="27" font-weight="700">6 学びを戻す</text><text x="280" y="713" font-size="20">方針・機器・教育を更新</text><text x="280" y="748" font-size="20">再発と新たな抜けを監視</text></g></g><path d="M450 255 Q540 150 625 180 M975 180 Q1070 150 1150 255 M1420 370 Q1490 490 1420 615 M1150 750 Q1060 835 975 790 M625 790 Q530 835 450 750 M180 615 Q105 490 180 370" fill="none" stroke="#2c7a7b" stroke-width="6" stroke-dasharray="14 10"/><text x="80" y="875" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="17" fill="#5c7070">教育用概念図：報告件数の増加だけで安全悪化と断定せず、分母と時間変化を含む指標で評価する。</text></svg>
