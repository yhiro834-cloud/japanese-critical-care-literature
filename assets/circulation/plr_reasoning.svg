<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">受動的下肢挙上PLRの推論</title><desc id="desc">基準測定、受動的下肢挙上、リアルタイムの一回拍出量または心拍出量測定、元へ戻す再評価の流れを示す。</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12Z" fill="#31546D"/></marker></defs><rect width="1600" height="900" fill="#fff"/><text x="80" y="78" font-family="Arial" font-size="42" font-weight="700" fill="#172B3A">PLR：戻せる「自己輸血」で前負荷反応をみる</text><text x="80" y="120" font-family="Arial" font-size="24" fill="#526B7A">Passive leg raise（受動的下肢挙上）は治療ではなく、短時間のdynamic test</text><g font-family="Arial" text-anchor="middle"><rect x="80" y="230" width="310" height="390" rx="30" fill="#EAF2F7"/><text x="235" y="285" font-size="28" font-weight="700">1 基準を揃える</text><text x="235" y="350" font-size="22">半座位など開始体位</text><text x="235" y="390" font-size="22">薬剤・換気条件・調律</text><text x="235" y="430" font-size="22">SV/CO・BP・CRT</text><rect x="455" y="230" width="310" height="390" rx="30" fill="#EEEAFE"/><text x="610" y="285" font-size="28" font-weight="700">2 PLRを行う</text><text x="610" y="350" font-size="22">体幹を水平へ</text><text x="610" y="390" font-size="22">下肢を挙上</text><text x="610" y="430" font-size="22">安全・疼痛を確認</text><rect x="830" y="230" width="310" height="390" rx="30" fill="#E7F6EE"/><text x="985" y="285" font-size="28" font-weight="700">3 Flowを測る</text><text x="985" y="350" font-size="22">SV / COをreal time測定</text><text x="985" y="390" font-size="22">BPだけに依存しない</text><text x="985" y="430" font-size="22">短時間の最大変化を見る</text><rect x="1205" y="230" width="310" height="390" rx="30" fill="#FFF2D9"/><text x="1360" y="285" font-size="28" font-weight="700">4 元へ戻す</text><text x="1360" y="350" font-size="22">値が戻るか確認</text><text x="1360" y="390" font-size="22">need / toleranceを評価</text><text x="1360" y="430" font-size="22">治療後も再評価</text></g><g stroke="#31546D" stroke-width="7" marker-end="url(#a)"><path d="M395 425 H440"/><path d="M770 425 H815"/><path d="M1145 425 H1190"/></g><rect x="170" y="690" width="1260" height="120" rx="25" fill="#FFF4F2"/><text x="800" y="735" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#B21F2D">陽性でも「輸液が必要・安全」とは限らない</text><text x="800" y="775" text-anchor="middle" font-family="Arial" font-size="22" fill="#526B7A">腹圧、疼痛、体位不能、測定遅延・精度などで解釈が難しい場合がある</text><text x="800" y="880" text-anchor="middle" font-family="Arial" font-size="17" fill="#526B7A">FIG-C-HEMO-003 · 実施方法・判定閾値は測定法と施設protocolに従う · 確認日 2026-08-12</text></svg>
