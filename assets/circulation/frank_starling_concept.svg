<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Frank-Starling曲線と輸液反応性</title><desc id="desc">前負荷増加に対して一回拍出量が増える領域と増えにくい領域を示し、輸液反応性と必要性・耐容性が別であることを説明。</desc><rect width="1600" height="900" fill="#fff"/><text x="80" y="78" font-family="Arial" font-size="42" font-weight="700" fill="#172B3A">Fluid responsiveness：反応する可能性と、輸液すべきかは別</text><text x="80" y="120" font-family="Arial" font-size="24" fill="#526B7A">Frank–Starling関係の定性的概念図（数値閾値を示す図ではない）</text><path d="M210 690 V210 M210 690 H1420" stroke="#31546D" stroke-width="7"/><text x="75" y="390" transform="rotate(-90 75 390)" font-family="Arial" font-size="28" fill="#172B3A">一回拍出量（SV）</text><text x="760" y="755" font-family="Arial" font-size="28" fill="#172B3A">前負荷（preload）</text><path d="M250 650 C460 300 780 250 1330 250" fill="none" stroke="#2B7A9B" stroke-width="14"/><circle cx="420" cy="445" r="24" fill="#26734D"/><circle cx="1120" cy="255" r="24" fill="#C74440"/><path d="M420 560 V445 M420 560 H610 M610 560 V350" stroke="#26734D" stroke-width="6" stroke-dasharray="14 10"/><path d="M1120 420 V255 M1120 420 H1300 M1300 420 V252" stroke="#C74440" stroke-width="6" stroke-dasharray="14 10"/><g font-family="Arial"><text x="300" y="610" font-size="27" font-weight="700" fill="#26734D">SVが増えやすい領域</text><text x="930" y="475" font-size="27" font-weight="700" fill="#C74440">SVが増えにくい領域</text><text x="930" y="515" font-size="22" fill="#526B7A">追加fluidでうっ血・肺水分が増える可能性</text></g><rect x="170" y="790" width="1260" height="70" rx="24" fill="#FFF2D9"/><text x="800" y="834" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#8B5B00">判断は3つ：①反応するか　②灌流改善が必要か　③fluidを耐えられるか</text><text x="800" y="890" text-anchor="middle" font-family="Arial" font-size="17" fill="#526B7A">FIG-C-HEMO-002 · 曲線の位置は病態・心機能で変化 · 単独で輸液適応を決めない · 確認日 2026-08-12</text></svg>
