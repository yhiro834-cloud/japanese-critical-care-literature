<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">圧・流れ・組織灌流を分けて考える</title><desc id="desc">血行動態を圧、血流、組織灌流の三層に分け、測定品質と再評価を含む概念図。</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12Z" fill="#31546D"/></marker></defs><rect width="1600" height="900" fill="#fff"/><text x="80" y="78" font-family="Arial" font-size="42" font-weight="700" fill="#172B3A">血行動態：圧があっても、流れ・灌流が十分とは限らない</text><text x="80" y="120" font-family="Arial" font-size="24" fill="#526B7A">monitor値を患者の臓器反応へつなげる</text>
  <g font-family="Arial" text-anchor="middle"><rect x="100" y="220" width="390" height="350" rx="30" fill="#FFF2D9"/><text x="295" y="280" font-size="34" font-weight="700" fill="#8B5B00">圧（Pressure）</text><text x="295" y="345" font-size="25">MAP・pulse pressure</text><text x="295" y="390" font-size="22">cuff / A-lineの信頼性</text><text x="295" y="435" font-size="22">level・zero・波形・体位</text><text x="295" y="510" font-size="21" fill="#526B7A">臓器を押し流す圧の手掛かり</text><rect x="605" y="220" width="390" height="350" rx="30" fill="#EEEAFE"/><text x="800" y="280" font-size="34" font-weight="700" fill="#5B5BD6">流れ（Flow）</text><text x="800" y="345" font-size="25">SV・CO = HR × SV</text><text x="800" y="390" font-size="22">前負荷・収縮力・後負荷</text><text x="800" y="435" font-size="22">調律・RV/LV・閉塞</text><text x="800" y="510" font-size="21" fill="#526B7A">運ばれる血液量の手掛かり</text><rect x="1110" y="220" width="390" height="350" rx="30" fill="#E7F6EE"/><text x="1305" y="280" font-size="34" font-weight="700" fill="#26734D">組織灌流</text><text x="1305" y="345" font-size="25">意識・CRT・皮膚</text><text x="1305" y="390" font-size="22">尿量・lactate・臓器機能</text><text x="1305" y="435" font-size="22">Hb・SaO₂・需要との釣合い</text><text x="1305" y="510" font-size="21" fill="#526B7A">実際に届いたかの手掛かり</text></g><path d="M500 395 H585" stroke="#31546D" stroke-width="8" marker-end="url(#a)"/><path d="M1005 395 H1090" stroke="#31546D" stroke-width="8" marker-end="url(#a)"/>
  <rect x="160" y="650" width="1280" height="130" rx="28" fill="#EAF2F7"/><text x="800" y="695" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#172B3A">介入前 → 目的を定めた介入 → 同じ指標で反応と害を再評価</text><text x="800" y="738" text-anchor="middle" font-family="Arial" font-size="23" fill="#526B7A">MAP達成だけで終了しない。呼吸悪化・うっ血・不整脈・末梢虚血も確認</text><text x="800" y="880" text-anchor="middle" font-family="Arial" font-size="17" fill="#526B7A">FIG-C-HEMO-001 · 単一値は診断ではない · Hemodynamic Monitoring SSOTを参照 · 確認日 2026-08-12</text></svg>
