<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">ショックの4表現型</title><desc id="desc">循環血液量低下、ポンプ機能低下、血管緊張低下、機械的閉塞の4表現型を比較し、混合型と再評価を強調。</desc><rect width="1600" height="900" fill="#fff"/><text x="80" y="78" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="42" font-weight="700" fill="#172B3A">ショックを4つの破綻へ分ける：量・ポンプ・血管・閉塞</text><text x="80" y="120" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="24" fill="#526B7A">所見は重なり、混合型が多い。分類は原因治療へ進むための仮説</text><g font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif"><rect x="70" y="190" width="350" height="470" rx="30" fill="#FFF2D9"/><text x="245" y="250" text-anchor="middle" font-size="30" font-weight="700" fill="#8B5B00">循環血液量減少性</text><text x="245" y="290" text-anchor="middle" font-size="23">循環血液量が不足</text><text x="105" y="360" font-size="22">例：出血、体液喪失</text><text x="105" y="410" font-size="22">手掛かり：出血・出納</text><text x="105" y="455" font-size="22">静脈還流低下</text><text x="105" y="550" font-size="21" fill="#526B7A">原因止血と反応・耐容性</text><rect x="440" y="190" width="350" height="470" rx="30" fill="#FDE9E8"/><text x="615" y="250" text-anchor="middle" font-size="30" font-weight="700" fill="#B21F2D">心原性</text><text x="615" y="290" text-anchor="middle" font-size="23">ポンプ機能が不足</text><text x="475" y="360" font-size="22">例：心筋梗塞、急性弁障害</text><text x="475" y="410" font-size="22">手掛かり：うっ血・冷感</text><text x="475" y="455" font-size="22">心エコーで左右心室・弁を評価</text><text x="475" y="550" font-size="21" fill="#526B7A">原因治療と血流補助</text><rect x="810" y="190" width="350" height="470" rx="30" fill="#E7F6EE"/><text x="985" y="250" text-anchor="middle" font-size="30" font-weight="700" fill="#26734D">血液分布異常性</text><text x="985" y="290" text-anchor="middle" font-size="23">血管緊張・分布が異常</text><text x="845" y="360" font-size="22">例：敗血症、アナフィラキシー</text><text x="845" y="410" font-size="22">手掛かり：温かい末梢も</text><text x="845" y="455" font-size="22">微小循環障害を伴う</text><text x="845" y="550" font-size="21" fill="#526B7A">原因治療と血管緊張</text><rect x="1180" y="190" width="350" height="470" rx="30" fill="#EEEAFE"/><text x="1355" y="250" text-anchor="middle" font-size="30" font-weight="700" fill="#5B5BD6">閉塞性</text><text x="1355" y="290" text-anchor="middle" font-size="23">充満・駆出が機械的に障害</text><text x="1215" y="360" font-size="22">例：肺血栓塞栓症、心タンポナーデ、緊張性気胸</text><text x="1215" y="410" font-size="22">手掛かり：急変・右心負荷</text><text x="1215" y="455" font-size="22">閉塞解除が時間依存</text><text x="1215" y="550" font-size="21" fill="#526B7A">緊急原因を先に除外</text></g><rect x="140" y="710" width="1320" height="105" rx="28" fill="#EAF2F7"/><text x="800" y="752" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="28" font-weight="700" fill="#172B3A">どの型でも：測定確認 → 組織灌流を評価 → 原因治療 → 介入反応と害を再評価</text><text x="800" y="792" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="22" fill="#B21F2D">「敗血症だから血液分布異常性だけ」と固定しない</text><text x="800" y="880" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="17" fill="#526B7A">FIG-C-SHOCK-001 · 単一所見で分類を確定しない · ショックSSOTを参照 · 確認日 2026-08-12</text></svg>
