<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">ショック臨床推論ループ</title><desc id="desc">患者評価、測定確認、灌流評価、表現型仮説、目的を定めた介入、反応と害の再評価を循環させるアルゴリズム。</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12Z" fill="#31546D"/></marker></defs><rect width="1600" height="900" fill="#fff"/><text x="80" y="78" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="42" font-weight="700" fill="#172B3A">Shockは一度分類して終わりではない：仮説を更新する</text><text x="80" y="120" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="24" fill="#526B7A">低血圧がなくても灌流不全を疑い、介入のたびに同じ指標へ戻る</text><g font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" text-anchor="middle"><rect x="110" y="240" width="300" height="150" rx="28" fill="#FFF2D9"/><text x="260" y="295" font-size="27" font-weight="700">1 患者を直接評価</text><text x="260" y="340" font-size="21">ABCDE・致命的原因</text><rect x="485" y="240" width="300" height="150" rx="28" fill="#EAF2F7"/><text x="635" y="295" font-size="27" font-weight="700">2 測定を検証</text><text x="635" y="340" font-size="21">cuff / A-line / waveform</text><rect x="860" y="240" width="300" height="150" rx="28" fill="#E7F6EE"/><text x="1010" y="295" font-size="27" font-weight="700">3 灌流を統合</text><text x="1010" y="340" font-size="21">意識・CRT・皮膚・尿量</text><rect x="1235" y="240" width="300" height="150" rx="28" fill="#EEEAFE"/><text x="1385" y="295" font-size="27" font-weight="700">4 表現型の仮説</text><text x="1385" y="340" font-size="21">量・pump・tone・閉塞</text><rect x="1047" y="555" width="300" height="150" rx="28" fill="#FDE9E8"/><text x="1197" y="610" font-size="27" font-weight="700">5 原因＋循環支持</text><text x="1197" y="655" font-size="21">目的・期待反応を定義</text><rect x="485" y="555" width="420" height="150" rx="28" fill="#FFF4F2"/><text x="695" y="610" font-size="27" font-weight="700">6 反応と害を再評価</text><text x="695" y="655" font-size="21">pressure / flow / perfusion / 呼吸</text></g><g stroke="#31546D" stroke-width="7" fill="none" marker-end="url(#a)"><path d="M415 315 H470"/><path d="M790 315 H845"/><path d="M1165 315 H1220"/><path d="M1385 405 V500 H1197 V540"/><path d="M1030 630 H920"/><path d="M470 630 H260 V405"/></g><text x="800" y="790" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="27" font-weight="700" fill="#B21F2D">MAP改善だけで蘇生完了としない。仮説が外れた可能性も含めて戻る</text><text x="800" y="880" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="17" fill="#526B7A">FIG-C-SHOCK-002 · 緊急原因への介入と応援要請を遅らせない · Shock SSOTを参照 · 確認日 2026-08-12</text></svg>
