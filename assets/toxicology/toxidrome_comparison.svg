<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">中毒初期対応と中毒症候群</title><desc id="desc">中毒症候群を単独所見で確定せず、共通評価と複数所見から仮説を作る図。</desc><rect width="1600" height="900" fill="#faf9f6"/><text x="70" y="75" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="42" font-weight="700" fill="#263746">急性中毒：解毒薬を探す前に、生命を支えながら仮説を更新</text><rect x="70" y="120" width="1460" height="100" rx="20" fill="#263746"/><text x="800" y="162" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="25" font-weight="700" fill="white">現場・医療者の安全 → ABCDE → 血糖・深部体温・12誘導心電図</text><text x="800" y="196" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="20" fill="#dbe8f0">呼吸抑制・ショック・痙攣・不整脈・高体温を先に治療</text>
<g font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif"><rect x="70" y="270" width="280" height="350" rx="20" fill="#e7f0ff" stroke="#3d70b2" stroke-width="3"/><text x="210" y="318" text-anchor="middle" font-size="26" font-weight="700" fill="#263746">オピオイド様</text><text x="105" y="370" font-size="21" fill="#263746">意識低下・縮瞳</text><text x="105" y="410" font-size="21" fill="#263746">呼吸数・換気低下</text><text x="105" y="468" font-size="19" font-weight="700" fill="#b33b3b">脅威</text><text x="105" y="505" font-size="19" fill="#263746">低換気・誤嚥</text><text x="105" y="540" font-size="19" fill="#263746">再鎮静</text><rect x="370" y="270" width="280" height="350" rx="20" fill="#fff0df" stroke="#df7b22" stroke-width="3"/><text x="510" y="318" text-anchor="middle" font-size="26" font-weight="700" fill="#263746">交感神経刺激様</text><text x="405" y="370" font-size="21" fill="#263746">興奮・散瞳・発汗</text><text x="405" y="410" font-size="21" fill="#263746">頻脈・高体温</text><text x="405" y="468" font-size="19" font-weight="700" fill="#b33b3b">脅威</text><text x="405" y="505" font-size="19" fill="#263746">痙攣・虚血</text><text x="405" y="540" font-size="19" fill="#263746">横紋筋融解</text><rect x="670" y="270" width="280" height="350" rx="20" fill="#f7eafa" stroke="#8a4b9f" stroke-width="3"/><text x="810" y="318" text-anchor="middle" font-size="26" font-weight="700" fill="#263746">抗コリン様</text><text x="705" y="370" font-size="21" fill="#263746">せん妄・散瞳</text><text x="705" y="410" font-size="21" fill="#263746">乾燥・熱い皮膚</text><text x="705" y="468" font-size="19" font-weight="700" fill="#b33b3b">脅威</text><text x="705" y="505" font-size="19" fill="#263746">高体温・不整脈</text><text x="705" y="540" font-size="19" fill="#263746">痙攣・尿閉</text><rect x="970" y="270" width="280" height="350" rx="20" fill="#e5f6ef" stroke="#328461" stroke-width="3"/><text x="1110" y="318" text-anchor="middle" font-size="26" font-weight="700" fill="#263746">コリン様</text><text x="1005" y="370" font-size="21" fill="#263746">分泌増加・縮瞳</text><text x="1005" y="410" font-size="21" fill="#263746">気管支分泌・筋力低下</text><text x="1005" y="468" font-size="19" font-weight="700" fill="#b33b3b">脅威</text><text x="1005" y="505" font-size="19" fill="#263746">気道内分泌物</text><text x="1005" y="540" font-size="19" fill="#263746">医療者の二次曝露</text><rect x="1270" y="270" width="260" height="350" rx="20" fill="#edf0f2" stroke="#637381" stroke-width="3"/><text x="1400" y="318" text-anchor="middle" font-size="25" font-weight="700" fill="#263746">鎮静薬様</text><text x="1300" y="370" font-size="21" fill="#263746">意識・呼吸低下</text><text x="1300" y="410" font-size="21" fill="#263746">運動失調</text><text x="1300" y="468" font-size="19" font-weight="700" fill="#b33b3b">脅威</text><text x="1300" y="505" font-size="19" fill="#263746">気道喪失</text><text x="1300" y="540" font-size="19" fill="#263746">混合摂取</text></g>
<rect x="120" y="675" width="1360" height="110" rx="24" fill="#fff" stroke="#b33b3b" stroke-width="4"/><text x="800" y="718" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="25" font-weight="700" fill="#b33b3b">中毒症候群（トキシドローム）は診断名ではなく、複数所見から作る仮説</text><text x="800" y="758" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="21" fill="#263746">合わない所見は捨てず、混合摂取・遅延吸収・感染・代謝異常・脳疾患を再検討する</text><text x="70" y="850" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="17" fill="#637381">教育用概念図：解毒薬、除染、血液浄化は適応・時期・害を評価し、中毒専門家と最新手順で確認する。</text></svg>
