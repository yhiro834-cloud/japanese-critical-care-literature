<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ARDSで肺胞に起こる変化</title><desc id="desc">正常肺胞とARDSの障害肺胞を比較し、透過性亢進、肺水分、虚脱、シャント、使える肺の減少を示す模式図。</desc>
  <rect width="1600" height="900" fill="#fff"/><text x="80" y="78" font-family="Arial" font-size="42" font-weight="700" fill="#172B3A">ARDS：肺全体が一様に硬くなるのではない</text><text x="80" y="120" font-family="Arial" font-size="24" fill="#526B7A">炎症で肺胞—毛細血管のbarrierが傷み、含気のある領域と虚脱・浸水領域が混在する</text>
  <rect x="90" y="175" width="660" height="520" rx="30" fill="#F2FAFD" stroke="#2B7A9B" stroke-width="4"/><rect x="850" y="175" width="660" height="520" rx="30" fill="#FFF3F1" stroke="#C74440" stroke-width="4"/>
  <g font-family="Arial" text-anchor="middle"><text x="420" y="235" font-size="32" font-weight="700" fill="#2B7A9B">正常に近い肺胞</text><text x="1180" y="235" font-size="32" font-weight="700" fill="#C74440">ARDSの障害肺胞</text></g>
  <g stroke="#31546D" stroke-width="8" fill="#DFF4FA"><circle cx="335" cy="405" r="105"/><circle cx="505" cy="405" r="105"/><path d="M420 610 V500"/></g><g stroke="#B21F2D" stroke-width="8"><circle cx="1090" cy="405" r="105" fill="#F7B7B2"/><ellipse cx="1280" cy="470" rx="120" ry="40" fill="#E28C86"/><path d="M1180 610 V515" fill="none"/></g>
  <g fill="#D65B55"><circle cx="1060" cy="370" r="20"/><circle cx="1110" cy="430" r="25"/><circle cx="1035" cy="455" r="15"/></g>
  <g font-family="Arial" font-size="23" fill="#172B3A"><text x="180" y="575">✓ 空気が入りやすい</text><text x="180" y="615">✓ 薄いbarrierでガス交換</text><text x="940" y="575">炎症・透過性亢進 → 肺水分 ↑</text><text x="940" y="615">surfactant低下 → 虚脱・不均一性</text><text x="940" y="655">換気されない肺胞への血流 → shunt</text></g>
  <rect x="120" y="735" width="1360" height="105" rx="25" fill="#EAF2F7"/><text x="800" y="775" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#172B3A">臨床で結びつける：使える肺（baby lung）を過度に伸ばさず、原因治療と肺保護を並行</text><text x="800" y="814" text-anchor="middle" font-family="Arial" font-size="22" fill="#526B7A">VT・Pplat・driving pressure・自発努力・体位・循環を同じ時刻で再評価する</text>
  <text x="800" y="880" text-anchor="middle" font-family="Arial" font-size="17" fill="#526B7A">FIG-B-ARDS-001 · 教育用模式図（解剖図ではない） · ARDS SSOTを参照 · 確認日 2026-08-12</text>
</svg>
