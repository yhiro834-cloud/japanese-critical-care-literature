<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">生体信号からモニター表示までの信号経路</title><desc id="desc">患者の生理からセンサー、伝送、処理、表示、臨床判断までの各段階で偽信号が生じることを示す。</desc><rect width="1600" height="900" fill="#f7fafc"/><text x="80" y="80" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="42" font-weight="700" fill="#20384d">モニターは患者そのものではない：信号の通り道を逆にたどる</text><text x="80" y="122" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="22" fill="#60788c">異常値では患者を先に見て支え、測定系を点検し、別原理の測定で照合する</text><g font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif"><g fill="#eaf3f8" stroke="#3c708d" stroke-width="4"><rect x="70" y="220" width="230" height="170" rx="24"/><rect x="330" y="220" width="230" height="170" rx="24"/><rect x="590" y="220" width="230" height="170" rx="24"/><rect x="850" y="220" width="230" height="170" rx="24"/><rect x="1110" y="220" width="230" height="170" rx="24"/><rect x="1370" y="220" width="170" height="170" rx="24"/></g><g text-anchor="middle" fill="#20384d"><text x="185" y="270" font-size="25" font-weight="700">患者の生理</text><text x="185" y="315" font-size="19">脈・呼吸・灌流</text><text x="185" y="348" font-size="19">本当の変化</text><text x="445" y="270" font-size="25" font-weight="700">センサー</text><text x="445" y="315" font-size="19">電極・プローブ</text><text x="445" y="348" font-size="19">カテーテル</text><text x="705" y="270" font-size="25" font-weight="700">伝送経路</text><text x="705" y="315" font-size="19">配線・配管</text><text x="705" y="348" font-size="19">接続・気泡</text><text x="965" y="270" font-size="25" font-weight="700">変換・処理</text><text x="965" y="315" font-size="19">高さ・ゼロ点</text><text x="965" y="348" font-size="19">演算・設定</text><text x="1225" y="270" font-size="25" font-weight="700">表示・警報</text><text x="1225" y="315" font-size="19">数値・波形</text><text x="1225" y="348" font-size="19">閾値</text><text x="1455" y="270" font-size="24" font-weight="700">判断</text><text x="1455" y="315" font-size="18">統合</text><text x="1455" y="348" font-size="18">介入</text></g><g stroke="#3c708d" stroke-width="5"><path d="M300 305H330 M560 305H590 M820 305H850 M1080 305H1110 M1340 305H1370"/></g><rect x="110" y="500" width="1380" height="170" rx="28" fill="#fff2e7" stroke="#bd6c31" stroke-width="4"/><text x="800" y="550" text-anchor="middle" font-size="28" font-weight="700" fill="#70401f">偽信号（アーチファクト）が生じる例</text><text x="180" y="610" font-size="21" fill="#70401f">体動・低灌流</text><text x="430" y="610" font-size="21" fill="#70401f">接触不良・部位</text><text x="700" y="610" font-size="21" fill="#70401f">屈曲・血栓・気泡</text><text x="1000" y="610" font-size="21" fill="#70401f">高さ・ゼロ・設定</text><text x="1290" y="610" font-size="21" fill="#70401f">表示遅延・閾値</text><rect x="220" y="745" width="1160" height="75" rx="20" fill="#20384d"/><text x="800" y="778" text-anchor="middle" font-size="22" font-weight="700" fill="white">患者・脈・灌流 → 信号源から順に点検 → 別原理で照合 → 介入後に再確認</text><text x="800" y="807" text-anchor="middle" font-size="17" fill="#d9e5ec">偽信号と本当の急変は同時に起こりうる</text></g></svg>
