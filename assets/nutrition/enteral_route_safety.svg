<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">経腸栄養ルートと投与前確認</title><desc id="desc">経鼻胃管、胃瘻、幽門後チューブの終末位置を模式的に比較し、患者、適応、位置、接続、消化管耐容性、誤嚥リスクを投与前後に確認する。</desc><rect width="1600" height="900" fill="#fff"/>
  <text x="70" y="72" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="42" font-weight="700" fill="#172B3A">経腸栄養：チューブの入口ではなく「先端がどこにあるか」を確認する</text><text x="70" y="116" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="23" fill="#526B7A">投与経路、位置確認法、誤接続防止、消化管耐容性、誤嚥リスクを一体で評価</text>
  <g font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif"><path d="M320 190 C230 230 220 360 310 400 C390 435 400 520 340 590 C300 640 315 730 410 740" fill="none" stroke="#D89C82" stroke-width="70" stroke-linecap="round"/><ellipse cx="465" cy="500" rx="130" ry="105" fill="#F2A98F" stroke="#A86A6A" stroke-width="6"/><path d="M570 510 C680 520 690 615 620 650 C555 685 590 735 700 735" fill="none" stroke="#F2A98F" stroke-width="55" stroke-linecap="round"/>
  <path d="M130 250 C220 250 265 315 300 390 C340 455 385 470 430 500" fill="none" stroke="#2B7A9B" stroke-width="12"/><circle cx="430" cy="500" r="15" fill="#2B7A9B"/>
  <path d="M150 300 C250 310 280 380 315 430 C370 500 430 500 540 520 C610 535 610 610 585 650" fill="none" stroke="#5B5BD6" stroke-width="12"/><circle cx="585" cy="650" r="15" fill="#5B5BD6"/>
  <path d="M755 500 H540" stroke="#C74440" stroke-width="12"/><circle cx="540" cy="500" r="15" fill="#C74440"/>
  <text x="100" y="220" font-size="22" font-weight="700" fill="#2B7A9B">経鼻胃管：胃内</text><text x="95" y="350" font-size="22" font-weight="700" fill="#5B5BD6">幽門後：十二指腸・空腸側</text><text x="650" y="465" font-size="22" font-weight="700" fill="#B21F2D">胃瘻：胃内へ直接</text>
  <rect x="850" y="180" width="680" height="560" rx="34" fill="#F6F8FA"/><text x="1190" y="235" text-anchor="middle" font-size="30" font-weight="700">投与前後の確認</text><text x="900" y="295" font-size="23" font-weight="700">1 患者と適応</text><text x="930" y="335" font-size="21">意識、気道保護、循環、腹部、栄養目標</text><text x="900" y="395" font-size="23" font-weight="700">2 位置と接続</text><text x="930" y="435" font-size="21">施設で定めた位置確認、固定、外部長、接続先</text><text x="900" y="495" font-size="23" font-weight="700">3 投与内容</text><text x="930" y="535" font-size="21">製剤、速度、水分、薬剤、禁忌・相互作用</text><text x="900" y="595" font-size="23" font-weight="700">4 反応</text><text x="930" y="635" font-size="21">嘔吐、膨満、排便、血糖、電解質、誤嚥徴候</text><text x="900" y="695" font-size="20" fill="#B21F2D">聴診による送気音だけで先端位置を確定しない</text></g>
  <rect x="170" y="780" width="1260" height="62" rx="22" fill="#EAF2F7"/><text x="800" y="820" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="23" font-weight="700" fill="#172B3A">ルートの存在＝安全な投与ではない。位置、接続、頭部挙上、耐容性、再栄養リスクを再評価</text><text x="800" y="880" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="17" fill="#526B7A">FIG-NUT-001 · 解剖を単純化した教育用模式図 · 栄養SSOT・施設手順を参照 · 確認日 2026-08-12</text>
</svg>
