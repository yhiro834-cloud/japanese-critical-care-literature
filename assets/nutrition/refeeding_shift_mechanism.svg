<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">再栄養症候群の細胞内移動と臓器障害</title><desc id="desc">低栄養後の糖質再導入に伴いリン、カリウム、マグネシウムが細胞内へ移動し、体液貯留と臓器障害を起こす機序。</desc><rect width="1600" height="900" fill="#fbfaf7"/><text x="80" y="80" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="42" font-weight="700" fill="#38443e">再栄養症候群：栄養開始後の「細胞内移動」と体液変化を追う</text><g font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif"><rect x="80" y="165" width="390" height="250" rx="28" fill="#f2eee5" stroke="#89795e" stroke-width="4"/><text x="275" y="220" text-anchor="middle" font-size="30" font-weight="700" fill="#38443e">飢餓・低栄養</text><text x="125" y="280" font-size="21" fill="#38443e">摂取不足・体重減少</text><text x="125" y="330" font-size="21" fill="#38443e">体内貯蔵の枯渇</text><text x="125" y="380" font-size="21" fill="#38443e">初期血中値が正常でも注意</text><rect x="605" y="165" width="390" height="250" rx="28" fill="#fff2d9" stroke="#c68a2d" stroke-width="4"/><text x="800" y="220" text-anchor="middle" font-size="30" font-weight="700" fill="#38443e">糖質・栄養を再導入</text><text x="650" y="280" font-size="21" fill="#38443e">インスリン反応</text><text x="650" y="330" font-size="21" fill="#38443e">ビタミンB1需要増加</text><text x="650" y="380" font-size="21" fill="#38443e">ナトリウム・水分貯留</text><rect x="1130" y="165" width="390" height="250" rx="28" fill="#e9f2ff" stroke="#4777a8" stroke-width="4"/><text x="1325" y="220" text-anchor="middle" font-size="30" font-weight="700" fill="#38443e">細胞内へ移動</text><text x="1175" y="280" font-size="23" fill="#38443e">リン（P）↓</text><text x="1175" y="330" font-size="23" fill="#38443e">カリウム（K）↓</text><text x="1175" y="380" font-size="23" fill="#38443e">マグネシウム（Mg）↓</text><path d="M470 290H605 M995 290H1130" stroke="#6c7b73" stroke-width="7"/><rect x="150" y="520" width="1300" height="220" rx="28" fill="#fff" stroke="#b14f4f" stroke-width="4"/><text x="800" y="570" text-anchor="middle" font-size="29" font-weight="700" fill="#b14f4f">臓器への影響</text><g text-anchor="middle" fill="#38443e"><text x="310" y="635" font-size="22" font-weight="700">心臓・体液</text><text x="310" y="675" font-size="19">不整脈・心不全・浮腫</text><text x="650" y="635" font-size="22" font-weight="700">呼吸</text><text x="650" y="675" font-size="19">筋力低下・離脱困難</text><text x="980" y="635" font-size="22" font-weight="700">神経</text><text x="980" y="675" font-size="19">意識変化・痙攣</text><text x="1300" y="635" font-size="22" font-weight="700">血液・代謝</text><text x="1300" y="675" font-size="19">酸素運搬・糖代謝障害</text></g><rect x="310" y="785" width="980" height="65" rx="18" fill="#38443e"/><text x="800" y="826" text-anchor="middle" font-size="21" font-weight="700" fill="white">開始前リスク評価 → 少量開始 → 全糖質源・電解質・臓器を反復評価</text></g></svg>
