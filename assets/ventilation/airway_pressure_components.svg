<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">気道内圧の構成：Ppeak、Pplat、PEEPtotal</title><desc id="desc">一定吸気流のvolume controlで吸気pauseを行った概念波形と、抵抗圧・driving pressure・PEEPtotalの関係。</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5B5BD6"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/><text x="80" y="78" font-family="Arial" font-size="42" font-weight="700" fill="#172B3A">気道内圧を「抵抗・弾性・PEEP」に分ける</text><text x="80" y="120" font-family="Arial" font-size="24" fill="#526B7A">一定吸気流のvolume control＋吸気pauseを想定した教育用波形</text>
  <line x1="130" y1="710" x2="980" y2="710" stroke="#31546D" stroke-width="4"/><line x1="130" y1="710" x2="130" y2="190" stroke="#31546D" stroke-width="4"/>
  <text x="555" y="765" text-anchor="middle" font-family="Arial" font-size="25" fill="#31546D">時間</text><text x="55" y="450" transform="rotate(-90 55 450)" text-anchor="middle" font-family="Arial" font-size="25" fill="#31546D">気道内圧</text>
  <line x1="130" y1="620" x2="980" y2="620" stroke="#D97706" stroke-width="3" stroke-dasharray="12 8"/><text x="155" y="605" font-family="Arial" font-size="23" font-weight="700" fill="#D97706">PEEPtotal</text>
  <path d="M130 620H250 L430 270 H570 V360 H700 V620 H980" fill="none" stroke="#1976A3" stroke-width="9" stroke-linejoin="round"/>
  <circle cx="430" cy="270" r="10" fill="#C74440"/><text x="430" y="230" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#C74440">Ppeak</text>
  <circle cx="610" cy="360" r="10" fill="#5B5BD6"/><text x="610" y="330" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#5B5BD6">Pplat</text>
  <text x="340" y="690" text-anchor="middle" font-family="Arial" font-size="22" fill="#172B3A">吸気流あり</text><text x="610" y="410" text-anchor="middle" font-family="Arial" font-size="22" fill="#172B3A">吸気pause：流量0</text><text x="830" y="690" text-anchor="middle" font-family="Arial" font-size="22" fill="#172B3A">呼気</text>
  <path d="M455 270H525V360" fill="none" stroke="#C74440" stroke-width="5" marker-end="url(#arr)"/><text x="750" y="255" font-family="Arial" font-size="26" font-weight="700" fill="#C74440">抵抗圧</text><text x="750" y="292" font-family="Arial" font-size="22" fill="#172B3A">Ppeak − Pplat</text>
  <path d="M720 360H665V615" fill="none" stroke="#5B5BD6" stroke-width="5" marker-end="url(#arr)"/><text x="750" y="385" font-family="Arial" font-size="26" font-weight="700" fill="#5B5BD6">Driving pressure</text><text x="750" y="422" font-family="Arial" font-size="22" fill="#172B3A">Pplat − PEEPtotal</text>
  <g font-family="Arial"><rect x="1050" y="205" width="470" height="145" rx="26" fill="#FFF4F2" stroke="#C74440" stroke-width="4"/><text x="1090" y="255" font-size="28" font-weight="700" fill="#C74440">抵抗成分</text><text x="1090" y="300" font-size="22" fill="#172B3A">気道・チューブ・分泌物・吸気流など</text><rect x="1050" y="390" width="470" height="145" rx="26" fill="#F6F3FF" stroke="#5B5BD6" stroke-width="4"/><text x="1090" y="440" font-size="28" font-weight="700" fill="#5B5BD6">弾性成分</text><text x="1090" y="485" font-size="22" fill="#172B3A">肺＋胸壁のcomplianceを反映</text><rect x="1050" y="575" width="470" height="145" rx="26" fill="#FFF2D9" stroke="#D97706" stroke-width="4"/><text x="1090" y="625" font-size="28" font-weight="700" fill="#D97706">呼気終末圧</text><text x="1090" y="670" font-size="22" fill="#172B3A">設定PEEP＋auto-PEEP = PEEPtotal</text></g>
  <rect x="200" y="805" width="1320" height="55" rx="18" fill="#EAF2F7"/><text x="860" y="842" text-anchor="middle" font-family="Arial" font-size="18" fill="#31546D">FIG-V-VENT-001 · Pplatは十分なpause・flow 0・leak/努力なし等の測定条件を確認して解釈する · 確認日 2026-08-12</text>
</svg>
