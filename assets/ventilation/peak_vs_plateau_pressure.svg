<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">PpeakとPplatで高圧を分解する</title><desc id="desc">基準、抵抗上昇、compliance低下の3パターンを相対的な圧の積み上げ棒で比較。</desc>
  <rect width="1600" height="900" fill="#fff"/><text x="80" y="78" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="42" font-weight="700" fill="#172B3A">高いPpeakを見たら、Pplatとの関係で分ける</text><text x="80" y="120" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="24" fill="#526B7A">同じvolume・flow条件を比較する概念図。患者、回路、測定条件を先に確認</text>
  <g font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" text-anchor="middle"><text x="340" y="205" font-size="30" font-weight="700" fill="#31546D">基準</text><text x="800" y="205" font-size="30" font-weight="700" fill="#C74440">抵抗上昇</text><text x="1260" y="205" font-size="30" font-weight="700" fill="#5B5BD6">Compliance低下</text></g>
  <g stroke="#31546D" stroke-width="3">
    <rect x="230" y="650" width="220" height="90" fill="#FFF2D9"/><rect x="230" y="420" width="220" height="230" fill="#EEEAFE"/><rect x="230" y="330" width="220" height="90" fill="#FDE9E8"/>
    <rect x="690" y="650" width="220" height="90" fill="#FFF2D9"/><rect x="690" y="420" width="220" height="230" fill="#EEEAFE"/><rect x="690" y="250" width="220" height="170" fill="#FDE9E8"/>
    <rect x="1150" y="650" width="220" height="90" fill="#FFF2D9"/><rect x="1150" y="300" width="220" height="350" fill="#EEEAFE"/><rect x="1150" y="210" width="220" height="90" fill="#FDE9E8"/>
  </g>
  <g font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="22" text-anchor="middle" fill="#172B3A"><text x="340" y="705">PEEPtotal</text><text x="340" y="545">弾性圧</text><text x="340" y="385">抵抗圧</text><text x="800" y="705">PEEPtotal</text><text x="800" y="545">弾性圧</text><text x="800" y="340">抵抗圧 ↑</text><text x="1260" y="705">PEEPtotal</text><text x="1260" y="480">弾性圧 ↑</text><text x="1260" y="265">抵抗圧</text></g>
  <g font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="22" font-weight="700"><text x="470" y="338" fill="#C74440">Ppeak</text><text x="470" y="428" fill="#5B5BD6">Pplat</text><text x="930" y="258" fill="#C74440">Ppeak ↑</text><text x="930" y="428" fill="#5B5BD6">Pplatほぼ不変</text><text x="1390" y="218" fill="#C74440">Ppeak ↑</text><text x="1390" y="308" fill="#5B5BD6">Pplat ↑</text></g>
  <g font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif"><rect x="130" y="775" width="420" height="75" rx="22" fill="#EAF2F7"/><text x="340" y="807" text-anchor="middle" font-size="21" fill="#172B3A">基準値とtrendを患者ごとに比較</text><text x="340" y="834" text-anchor="middle" font-size="19" fill="#526B7A">絶対値は図示していない</text><rect x="590" y="775" width="420" height="75" rx="22" fill="#FFF4F2"/><text x="800" y="807" text-anchor="middle" font-size="21" fill="#172B3A">分泌物・屈曲・気管支攣縮など</text><text x="800" y="834" text-anchor="middle" font-size="19" fill="#526B7A">flow条件も確認</text><rect x="1050" y="775" width="420" height="75" rx="22" fill="#F6F3FF"/><text x="1260" y="807" text-anchor="middle" font-size="21" fill="#172B3A">肺胞充満・虚脱・胸壁変化など</text><text x="1260" y="834" text-anchor="middle" font-size="19" fill="#526B7A">新規気胸等の緊急原因も評価</text></g>
  <text x="800" y="882" text-anchor="middle" font-family="Hiragino Sans, Yu Gothic, Arial, sans-serif" font-size="17" fill="#526B7A">FIG-V-VENT-002 · 同じvolume・flow条件での定性的比較 · 患者、回路、測定条件を先に確認 · 確認日 2026-08-12</text>
</svg>
