<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">呼気流波形からauto-PEEPを疑う</title><desc id="desc">次の吸気前に呼気流がzeroへ戻る例と戻らない例を比較し、air trappingの評価手順を示す。</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5B5BD6"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/><text x="80" y="78" font-family="Arial" font-size="42" font-weight="700" fill="#172B3A">呼気流がzeroへ戻る前に次の吸気が始まっていないか</text><text x="80" y="120" font-family="Arial" font-size="24" fill="#526B7A">flow–time波形はair trappingの手掛かり。auto-PEEPの定量には条件を整えた呼気終末hold等が必要</text>
  <g stroke="#31546D" stroke-width="3"><line x1="120" y1="380" x2="910" y2="380"/><line x1="120" y1="690" x2="910" y2="690"/></g>
  <text x="120" y="200" font-family="Arial" font-size="30" font-weight="700" fill="#16856B">呼気流がzeroへ戻る例</text><path d="M140 380V260H330V380 C390 475 520 410 610 385 C680 380 750 380 810 380 V260H900" fill="none" stroke="#16856B" stroke-width="9"/><circle cx="650" cy="380" r="10" fill="#16856B"/><text x="650" y="430" text-anchor="middle" font-family="Arial" font-size="22" fill="#16856B">次の吸気前にzero</text>
  <text x="120" y="525" font-family="Arial" font-size="30" font-weight="700" fill="#C74440">呼気流がzeroへ戻らない例</text><path d="M140 690V570H330V690 C420 790 570 750 710 710 L810 700 V570H900" fill="none" stroke="#C74440" stroke-width="9"/><line x1="810" y1="690" x2="810" y2="570" stroke="#C74440" stroke-width="3" stroke-dasharray="10 8"/><text x="690" y="835" text-anchor="middle" font-family="Arial" font-size="22" fill="#C74440">呼気が完了する前に次の吸気 → air trappingを示唆</text>
  <g font-family="Arial"><rect x="1010" y="195" width="510" height="135" rx="24" fill="#EAF2F7" stroke="#31546D" stroke-width="3"/><text x="1050" y="240" font-size="27" font-weight="700" fill="#31546D">1　患者・波形の妥当性</text><text x="1050" y="285" font-size="21" fill="#172B3A">努力、leak、回路、mode、呼吸数を確認</text><rect x="1010" y="370" width="510" height="135" rx="24" fill="#FFF2D9" stroke="#D97706" stroke-width="3"/><text x="1050" y="415" font-size="27" font-weight="700" fill="#D97706">2　呼気時間と時定数</text><text x="1050" y="460" font-size="21" fill="#172B3A">抵抗↑・compliance・RR・VT・吸気時間</text><rect x="1010" y="545" width="510" height="135" rx="24" fill="#E6F5F2" stroke="#16856B" stroke-width="3"/><text x="1050" y="590" font-size="27" font-weight="700" fill="#16856B">3　原因に応じ調整</text><text x="1050" y="635" font-size="21" fill="#172B3A">気道・分泌物・気管支攣縮・設定を再評価</text></g>
  <path d="M1265 330V360M1265 505V535" stroke="#5B5BD6" stroke-width="5" marker-end="url(#arr)"/>
  <rect x="1000" y="735" width="530" height="85" rx="22" fill="#FFF4F2" stroke="#C74440" stroke-width="3"/><text x="1265" y="770" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#C74440">外因性PEEPを反射的に増減しない</text><text x="1265" y="800" text-anchor="middle" font-family="Arial" font-size="19" fill="#172B3A">患者努力と病態を含め、反応と循環への影響を確認</text>
  <text x="80" y="875" font-family="Arial" font-size="19" fill="#526B7A">FIG-V-VENT-004 · 波形所見は示唆であり、患者と測定条件を統合する · 確認日 2026-08-12</text>
</svg>
