<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">患者人工呼吸器非同調の代表波形</title><desc id="desc">正常同調、無効努力、二重トリガーの圧・流量時間波形を比較し、患者評価と原因検索を促す。</desc><rect width="1600" height="900" fill="#fff"/><text x="80" y="78" font-family="Arial" font-size="42" font-weight="700" fill="#172B3A">患者–人工呼吸器非同調：波形は「患者要求と機械送気のずれ」の手掛かり</text><text x="80" y="120" font-family="Arial" font-size="24" fill="#526B7A">波形だけで診断せず、患者の努力・苦痛・呼吸音・回路・設定・鎮静を同時に確認</text><g font-family="Arial"><text x="80" y="225" font-size="29" font-weight="700" fill="#26734D">正常に近い同調</text><text x="80" y="440" font-size="29" font-weight="700" fill="#C47A00">Ineffective effort（無効努力）</text><text x="80" y="655" font-size="29" font-weight="700" fill="#C74440">Double triggering（二重トリガー）</text><g stroke="#B9C7D0" stroke-width="3"><line x1="420" y1="250" x2="1480" y2="250"/><line x1="420" y1="465" x2="1480" y2="465"/><line x1="420" y1="680" x2="1480" y2="680"/></g><text x="250" y="275" font-size="20">Flow</text><text x="250" y="490" font-size="20">Flow</text><text x="250" y="705" font-size="20">Flow</text></g><path d="M420 250 Q470 150 520 250 Q570 330 620 250 M760 250 Q810 150 860 250 Q910 330 960 250" fill="none" stroke="#26734D" stroke-width="10"/><path d="M420 465 Q470 365 520 465 Q570 545 620 465 Q675 500 720 465 Q780 365 840 465" fill="none" stroke="#C47A00" stroke-width="10"/><circle cx="680" cy="485" r="28" fill="none" stroke="#C74440" stroke-width="6"/><text x="735" y="535" font-family="Arial" font-size="22" fill="#B21F2D">小さな努力が送気につながらない</text><path d="M420 680 Q470 580 520 680 Q550 735 575 680 Q625 580 675 680 Q730 760 785 680" fill="none" stroke="#C74440" stroke-width="10"/><path d="M570 565 V770" stroke="#C74440" stroke-width="4" stroke-dasharray="12 10"/><text x="820" y="735" font-family="Arial" font-size="22" fill="#B21F2D">十分に呼出する前に次の送気 → VT積み上がりの可能性</text><rect x="130" y="790" width="1340" height="70" rx="24" fill="#EAF2F7"/><text x="800" y="834" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#172B3A">対応：患者を評価 → airway/回路 → drive・努力 → trigger/flow/cycling → 原因別に調整 → 再評価</text><text x="800" y="890" text-anchor="middle" font-family="Arial" font-size="17" fill="#526B7A">FIG-V-VENT-005 · 定性的時間波形 · 鎮静・筋弛緩は原因検索の代用ではない · 確認日 2026-08-12</text></svg>
