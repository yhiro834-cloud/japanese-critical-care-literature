<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">人工呼吸器の正常時間波形例</title><desc id="desc">一定吸気流のvolume control、吸気pauseを含む1呼吸のpressure-time、flow-time、volume-time波形。</desc>
  <rect width="1600" height="900" fill="#fff"/><text x="80" y="78" font-family="Arial" font-size="42" font-weight="700" fill="#172B3A">3つの時間波形は同じ1呼吸を別の角度から見る</text><text x="80" y="120" font-family="Arial" font-size="24" fill="#526B7A">一定吸気流のvolume control＋吸気pauseの例。mode・設定・患者努力で形は変わる</text>
  <rect x="220" y="155" width="900" height="680" fill="#F9FBFC"/><rect x="220" y="155" width="380" height="680" fill="#EAF6FB" opacity=".55"/><rect x="600" y="155" width="150" height="680" fill="#F6F3FF" opacity=".7"/><rect x="750" y="155" width="370" height="680" fill="#FFF2D9" opacity=".45"/>
  <g font-family="Arial" font-size="22" font-weight="700" text-anchor="middle"><text x="410" y="190" fill="#1976A3">吸気</text><text x="675" y="190" fill="#5B5BD6">pause</text><text x="935" y="190" fill="#D97706">呼気</text></g>
  <g stroke="#31546D" stroke-width="3"><line x1="220" y1="385" x2="1120" y2="385"/><line x1="220" y1="610" x2="1120" y2="610"/><line x1="220" y1="835" x2="1120" y2="835"/></g>
  <path d="M220 340H270 L520 245 H600 L620 300 H750 V340 H1120" fill="none" stroke="#C74440" stroke-width="8"/>
  <path d="M220 540H600 V610 H750 C780 690 880 675 960 635 C1010 615 1060 610 1120 610" fill="none" stroke="#1976A3" stroke-width="8"/>
  <path d="M220 815H270 L600 685 H750 L780 710 C870 780 980 812 1120 815" fill="none" stroke="#16856B" stroke-width="8"/>
  <g font-family="Arial" font-size="26" font-weight="700"><text x="75" y="310" fill="#C74440">Pressure</text><text x="75" y="535" fill="#1976A3">Flow</text><text x="75" y="760" fill="#16856B">Volume</text></g>
  <text x="635" y="275" font-family="Arial" font-size="20" fill="#5B5BD6">Pplat</text><text x="310" y="520" font-family="Arial" font-size="20" fill="#1976A3">一定の吸気流</text><text x="645" y="590" font-family="Arial" font-size="20" fill="#5B5BD6">flow = 0</text><text x="860" y="700" font-family="Arial" font-size="20" fill="#D97706">呼気流は負方向</text>
  <g font-family="Arial"><rect x="1190" y="210" width="340" height="150" rx="24" fill="#FFF4F2" stroke="#C74440" stroke-width="3"/><text x="1225" y="255" font-size="26" font-weight="700" fill="#C74440">圧波形</text><text x="1225" y="300" font-size="21" fill="#172B3A">抵抗・弾性・PEEP</text><text x="1225" y="330" font-size="21" fill="#172B3A">測定条件を確認</text><rect x="1190" y="405" width="340" height="150" rx="24" fill="#EAF6FB" stroke="#1976A3" stroke-width="3"/><text x="1225" y="450" font-size="26" font-weight="700" fill="#1976A3">流量波形</text><text x="1225" y="495" font-size="21" fill="#172B3A">trigger・cycle・air trapping</text><text x="1225" y="525" font-size="21" fill="#172B3A">の手掛かり</text><rect x="1190" y="600" width="340" height="150" rx="24" fill="#E6F5F2" stroke="#16856B" stroke-width="3"/><text x="1225" y="645" font-size="26" font-weight="700" fill="#16856B">容量波形</text><text x="1225" y="690" font-size="21" fill="#172B3A">吸気・呼気VT、leak</text><text x="1225" y="720" font-size="21" fill="#172B3A">の手掛かり</text></g>
  <text x="80" y="875" font-family="Arial" font-size="19" fill="#526B7A">FIG-V-VENT-003 · 代表的な制御呼吸の模式図であり、すべての正常波形を示すものではない · 確認日 2026-08-12</text>
</svg>
