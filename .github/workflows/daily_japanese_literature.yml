name: Daily Japanese literature

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-japanese-literature
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CINII_APP_ID: ${{ secrets.CINII_APP_ID }}
      MAX_ARTICLES: ${{ vars.MAX_ARTICLES || '50' }}
      DAYS_BACK: ${{ vars.DAYS_BACK || '7' }}
      START_YEAR: ${{ vars.START_YEAR || '2020' }}
      DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
      ENABLE_CINII: ${{ vars.ENABLE_CINII || 'true' }}
      ENABLE_PUBMED_JAPANESE: ${{ vars.ENABLE_PUBMED_JAPANESE || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest
      - name: Collect literature
        run: python -m src.main
      - name: Commit new literature only
        shell: bash
        run: |
          if git diff --quiet -- data literature; then
            echo "新規文献はありません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data literature
          git commit -m "docs: add Japanese literature report $(date -u -d '+9 hours' +%F)"
          git push
